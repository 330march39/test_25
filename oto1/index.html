<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音情報処理 - デジタル体験教材</title>
  
  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Zen Maru Gothic"', 'sans-serif'],
          },
          colors: {
            slate: {
              700: '#334155',
              800: '#1e293b',
            }
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'float-slow': 'float-slow 8s ease-in-out infinite',
            'float-slower': 'float-slow 12s ease-in-out infinite',
            'fade-in': 'fadeIn 0.6s ease-out forwards',
            'bounce-sm': 'bounce-sm 1.5s infinite',
            'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            'float-slow': {
              '0%, 100%': { transform: 'translateY(0) scale(1)' },
              '50%': { transform: 'translateY(-30px) scale(1.05)' },
            },
            fadeIn: {
              'from': { opacity: '0', transform: 'translateY(15px)' },
              'to': { opacity: '1', transform: 'translateY(0)' },
            },
            'bounce-sm': {
              '0%, 100%': { transform: 'translateY(-10%)', animationTimingFunction: 'cubic-bezier(0.8,0,1,1)' },
              '50%': { transform: 'none', animationTimingFunction: 'cubic-bezier(0,0,0.2,1)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <!-- バージョン更新対策として、明示的に transform-react-jsx プラグインを指定 -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 全体設定 */
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      background-attachment: fixed;
      color: #334155; /* 真っ黒を避けたslate-700 */
      overflow-x: hidden;
    }

    /* ルビのスタイル調整 */
    ruby {
      ruby-position: over;
      ruby-align: center;
    }
    rt {
      font-size: 0.55em;
      color: #64748b;
      letter-spacing: 0;
      transform: translateY(2px);
    }

    /* 蛍光ペン風ハイライト */
    .highlight {
      background: linear-gradient(transparent 60%, rgba(253, 224, 71, 0.7) 40%);
      padding: 0 4px;
      border-radius: 2px;
      font-weight: 700;
    }

    /* グラスモーフィズム */
    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* シミュレーター用スライダーカスタマイズ */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      border: 2px solid currentColor;
      transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      cursor: pointer;
      background: rgba(0,0,0,0.1);
      border-radius: 4px;
    }
    
    /* スクロールバー */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="antialiased leading-loose">
  
  <!-- 背景装飾（パステルカラーの大きな円） -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
    <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-pink-300/30 rounded-full blur-[100px] animate-float-slow"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-cyan-300/20 rounded-full blur-[120px] animate-float-slower" style="animation-delay: -2s;"></div>
    <div class="absolute top-[30%] left-[60%] w-[40vw] h-[40vw] bg-purple-300/20 rounded-full blur-[90px] animate-float-slow" style="animation-delay: -5s;"></div>
  </div>

  <div id="root"></div>

  <!-- React アプリケーション -->
  <script type="text/babel" data-type="module" data-presets="react,env" data-plugins="transform-react-jsx">
    // Babel設定: クラシックな変換方式を明示的に使用
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    
    const { useState, useEffect, useRef, useMemo } = React;

    // --- カスタムアイコン (Lucide風) ---
    const Icons = {
      Wave: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M2 12h4l3-9 5 18 3-9h5" />
        </svg>
      ),
      Speaker: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/>
          <circle cx="12" cy="14" r="4"/><path d="M12 6h.01"/>
        </svg>
      ),
      Volume: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      ),
      Lightbulb: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>
        </svg>
      ),
      Check: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      ),
      X: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      ),
      Headphones: ({ className }) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      )
    };

    // --- 共通コンポーネント ---
    const Section = ({ title, icon: Icon, themeColor, children, delay }) => {
      const colorMap = {
        cyan: 'text-cyan-600',
        pink: 'text-pink-600',
        yellow: 'text-amber-600',
        green: 'text-emerald-600',
      };
      const bgMap = {
        cyan: 'bg-cyan-100',
        pink: 'bg-pink-100',
        yellow: 'bg-amber-100',
        green: 'bg-emerald-100',
      };
      
      return (
        <section className={`glass rounded-3xl p-6 md:p-10 mb-12 animate-fade-in transition-all duration-500 hover:shadow-xl`} style={{animationDelay: delay}}>
          <div className="flex items-center gap-4 mb-6">
            <div className={`p-3 rounded-2xl ${bgMap[themeColor]} ${colorMap[themeColor]} shadow-sm`}>
              <Icon className="w-8 h-8 animate-float" />
            </div>
            <h2 className="text-2xl md:text-3xl font-bold tracking-tight text-slate-800">{title}</h2>
          </div>
          <div className="space-y-6 text-lg">
            {children}
          </div>
        </section>
      );
    };

    const TipBox = ({ title, children, themeColor = 'cyan' }) => {
      const [isOpen, setIsOpen] = useState(false);
      const colorMap = {
        cyan: 'border-cyan-200 bg-cyan-50/80',
        pink: 'border-pink-200 bg-pink-50/80',
        yellow: 'border-amber-200 bg-amber-50/80',
        green: 'border-emerald-200 bg-emerald-50/80',
      };
      const textMap = {
        cyan: 'text-cyan-700',
        pink: 'text-pink-700',
        yellow: 'text-amber-700',
        green: 'text-emerald-700',
      };

      return (
        <div className={`mt-8 border-2 rounded-2xl overflow-hidden transition-all duration-300 ${colorMap[themeColor]}`}>
          <button 
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full p-4 flex items-center justify-between font-bold ${textMap[themeColor]} hover:bg-white/50 transition-colors`}
          >
            <div className="flex items-center gap-2">
              <Icons.Lightbulb className="w-5 h-5" />
              <span>豆知識：{title}</span>
            </div>
            <span className="text-xl leading-none">{isOpen ? '−' : '＋'}</span>
          </button>
          <div className={`transition-all duration-500 ease-in-out ${isOpen ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0'} overflow-hidden`}>
            <div className="p-4 pt-0 border-t border-white/50 text-base leading-relaxed">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const Quiz = ({ question, options, themeColor = 'cyan' }) => {
      const [selectedIndex, setSelectedIndex] = useState(null);
      const [showResult, setShowResult] = useState(false);

      const colorMap = {
        cyan: 'hover:border-cyan-400 hover:bg-cyan-50',
        pink: 'hover:border-pink-400 hover:bg-pink-50',
        yellow: 'hover:border-amber-400 hover:bg-amber-50',
        green: 'hover:border-emerald-400 hover:bg-emerald-50',
      };

      const handleSelect = (index) => {
        if (showResult) return;
        setSelectedIndex(index);
        setShowResult(true);
      };

      return (
        <div className="glass-panel p-6 rounded-2xl mt-8 shadow-sm">
          <p className="font-bold text-slate-800 mb-4 flex items-center gap-2">
            <span className="bg-slate-700 text-white text-xs px-2 py-1 rounded-full uppercase tracking-wider">Quiz</span>
            {question}
          </p>
          <div className="space-y-3">
            {options.map((opt, idx) => {
              const isSelected = selectedIndex === idx;
              let btnClass = `w-full text-left p-4 rounded-xl border-2 transition-all duration-200 bg-white/80 ${!showResult ? colorMap[themeColor] + ' cursor-pointer' : 'cursor-default'}`;
              
              if (showResult) {
                if (opt.isCorrect) {
                  btnClass = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800 font-bold shadow-sm";
                } else if (isSelected) {
                  btnClass = "w-full text-left p-4 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-700 opacity-80";
                } else {
                  btnClass = "w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-slate-50 opacity-50";
                }
              }

              return (
                <button 
                  key={idx} 
                  onClick={() => handleSelect(idx)}
                  className={btnClass}
                  disabled={showResult}
                >
                  <div className="flex items-center justify-between">
                    <span>{opt.text}</span>
                    {showResult && opt.isCorrect && <Icons.Check className="w-5 h-5 text-emerald-500 animate-bounce-sm" />}
                    {showResult && isSelected && !opt.isCorrect && <Icons.X className="w-5 h-5 text-rose-400" />}
                  </div>
                </button>
              );
            })}
          </div>
          {showResult && (
            <div className="mt-4 p-4 bg-white/80 rounded-xl animate-fade-in border-l-4 border-slate-400 text-base">
              <span className="font-bold mr-2 text-slate-700">解説：</span>
              {options[selectedIndex].isCorrect ? '大正解！🎉 ' : '惜しい！😅 '}
              {options[selectedIndex].explanation}
            </div>
          )}
        </div>
      );
    };

    // --- 各セクションのシミュレーター ---

    // 1. 疎密波シミュレーター
    const SimulatorWave = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const canvasRef = useRef(null);
      const animationRef = useRef(null);
      const timeRef = useRef(0);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const numParticles = 80;
        const width = canvas.width;
        const height = canvas.height;

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          
          if (isPlaying) {
            timeRef.current += 0.05;
          }

          ctx.fillStyle = '#0891b2'; // cyan-600
          for (let i = 0; i < numParticles; i++) {
            for (let j = 0; j < 5; j++) {
              // ベース位置
              const baseX = (i / numParticles) * width;
              const baseY = (j / 4) * (height - 40) + 20;
              
              let x = baseX;
              if (isPlaying) {
                // 疎密波 (縦波) の計算
                // 波は右へ進む (timeRef - baseX)
                // 変位はx方向
                const displacement = Math.sin(timeRef.current * 2 - i * 0.2) * 15;
                x = baseX + displacement;
              }
              
              ctx.beginPath();
              ctx.arc(x, baseY, 3, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          animationRef.current = requestAnimationFrame(render);
        };
        render();

        return () => cancelAnimationFrame(animationRef.current);
      }, [isPlaying]);

      return (
        <div className="bg-white/60 p-6 rounded-2xl border border-cyan-100 my-6 shadow-sm">
          <h3 className="text-xl font-bold text-cyan-800 mb-2 flex items-center gap-2">
            <Icons.Wave className="w-5 h-5" /> ミニ実験：空気が押される様子
          </h3>
          <p className="text-sm text-slate-600 mb-4">ボタンを押すと、スピーカー（左端）から空気の粒が押されて波（<ruby>疎密波<rt>そみつは</rt></ruby>）が伝わる様子が観察できるよ。</p>
          
          <div className="relative w-full h-32 bg-slate-50 rounded-xl overflow-hidden border border-slate-200 mb-4 flex">
            <div className="w-12 h-full bg-slate-800 flex items-center justify-center z-10 shadow-lg relative">
              <Icons.Speaker className={`w-8 h-8 text-white transition-transform ${isPlaying ? 'animate-pulse-fast scale-110' : ''}`} />
            </div>
            <canvas ref={canvasRef} width="600" height="128" className="w-full h-full object-cover opacity-80" />
          </div>
          
          <div className="text-center">
            <button 
              onClick={() => setIsPlaying(!isPlaying)}
              className={`px-6 py-2 rounded-full font-bold text-white transition-all transform hover:scale-105 active:scale-95 shadow-md ${isPlaying ? 'bg-rose-500 hover:bg-rose-600' : 'bg-cyan-600 hover:bg-cyan-700'}`}
            >
              {isPlaying ? '■ 音を止める' : '▶ 音を鳴らす'}
            </button>
          </div>
        </div>
      );
    };

    // 2. 周波数シミュレーター
    const SimulatorFreq = () => {
      const [freq, setFreq] = useState(2); // Hz
      const width = 600;
      const height = 150;
      
      // 正弦波のSVGパス生成
      const pathData = useMemo(() => {
        const points = [];
        for (let x = 0; x <= width; x += 2) {
          const t = x / width; // 0 to 1
          // sin(2π * f * t)
          const y = height/2 - Math.sin(t * Math.PI * 2 * freq) * (height/2 - 20);
          points.push(`${x},${y}`);
        }
        return `M ${points.join(' L ')}`;
      }, [freq]);

      return (
        <div className="bg-white/60 p-6 rounded-2xl border border-pink-100 my-6 shadow-sm">
          <h3 className="text-xl font-bold text-pink-800 mb-4 flex items-center gap-2">
            <Icons.Wave className="w-5 h-5" /> ミニ実験：波の形と周波数
          </h3>
          
          <div className="relative w-full h-40 bg-slate-900 rounded-xl overflow-hidden mb-6 shadow-inner p-4 flex flex-col justify-center">
            {/* グリッド線 */}
            <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>
            {/* 時間軸ラベル */}
            <div className="absolute bottom-2 right-4 text-xs text-slate-400 font-mono">1 sec →</div>
            
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible drop-shadow-[0_0_8px_rgba(236,72,153,0.8)]">
              <path d={pathData} fill="none" stroke="#f472b6" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </div>

          <div className="flex items-center gap-6 px-4">
            <div className="font-bold text-slate-700 w-24 text-right">
              <span className="text-3xl text-pink-600">{freq}</span> Hz
            </div>
            <div className="flex-1">
              <input 
                type="range" 
                min="1" max="8" step="1" 
                value={freq} 
                onChange={(e) => setFreq(parseInt(e.target.value))}
                className="text-pink-500"
              />
              <div className="flex justify-between text-xs text-slate-400 mt-1 px-2">
                <span>低い音 (ゆったり)</span>
                <span>高い音 (小刻み)</span>
              </div>
            </div>
          </div>
          {freq === 8 && (
            <div className="mt-4 text-center text-pink-600 font-bold animate-fade-in bg-pink-100 p-2 rounded-lg">
              ✨ すごい小刻み！これが「高い音」の正体です。
            </div>
          )}
        </div>
      );
    };

    // 3. デシベルシミュレーター
    const SimulatorDecibel = () => {
      const [pressureRatio, setPressureRatio] = useState(1);
      
      // 計算: dB = 20 * log10(P/P0)
      const dbValue = 20 * Math.log10(pressureRatio);
      
      return (
        <div className="bg-white/60 p-6 rounded-2xl border border-amber-100 my-6 shadow-sm">
          <h3 className="text-xl font-bold text-amber-800 mb-2 flex items-center gap-2">
            <Icons.Volume className="w-5 h-5" /> ミニ実験：気圧とデシベル（dB）
          </h3>
          <p className="text-sm text-slate-600 mb-6">気圧の変化（倍率）を動かすと、人間の耳が感じる「音圧レベル(dB)」がどう変わるか見てみよう。</p>
          
          <div className="flex flex-col md:flex-row gap-6 items-center">
            {/* コントローラー */}
            <div className="w-full md:w-1/2 space-y-6">
              <div>
                <label className="block text-sm font-bold text-slate-700 mb-2">気圧の強さ（元の何倍？）</label>
                <input 
                  type="range" 
                  min="1" max="10" step="1" 
                  value={pressureRatio} 
                  onChange={(e) => setPressureRatio(parseInt(e.target.value))}
                  className="text-amber-500"
                />
                <div className="text-center mt-2 font-bold text-xl text-slate-700">
                  <span className="text-amber-600 text-3xl">{pressureRatio}</span> 倍
                </div>
              </div>
            </div>

            {/* 結果表示 */}
            <div className="w-full md:w-1/2 flex justify-center">
              <div className={`relative w-48 h-48 rounded-full border-8 flex flex-col items-center justify-center transition-all duration-300 ${pressureRatio === 10 ? 'border-rose-400 bg-rose-50 shadow-[0_0_30px_rgba(251,113,133,0.4)]' : 'border-amber-400 bg-amber-50'}`}>
                <div className="text-sm font-bold text-slate-500">音圧レベルの上昇</div>
                <div className="text-4xl font-black text-slate-800 my-1">
                  +{dbValue.toFixed(1)} <span className="text-xl">dB</span>
                </div>
                {pressureRatio === 2 && <div className="absolute -bottom-10 text-rose-600 font-bold animate-fade-in whitespace-nowrap text-sm">💡 気圧2倍で +6dB！</div>}
                {pressureRatio === 10 && <div className="absolute -bottom-10 text-rose-600 font-bold animate-fade-in whitespace-nowrap text-sm text-center">🔥 10倍で +20dB！<br/>(対数のマジック)</div>}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 4. SNR シミュレーター
    const SimulatorSNR = () => {
      const [signal, setSignal] = useState(60);
      const [noise, setNoise] = useState(50);
      
      const snr = signal - noise;
      
      let statusColor = 'text-emerald-600';
      let statusBg = 'bg-emerald-100';
      let message = 'ハッキリ聞こえる！ (S > N)';
      let SpeakerIcon = Icons.Volume;
      
      if (snr < 0) {
        statusColor = 'text-rose-600';
        statusBg = 'bg-rose-100';
        message = '雑音に埋もれて聞こえない… (S < N)';
        SpeakerIcon = Icons.X;
      } else if (snr < 10) {
        statusColor = 'text-amber-600';
        statusBg = 'bg-amber-100';
        message = 'なんとか聞こえるレベル (S ≒ N)';
      }

      return (
        <div className="bg-white/60 p-6 rounded-2xl border border-emerald-100 my-6 shadow-sm">
          <h3 className="text-xl font-bold text-emerald-800 mb-6 flex items-center gap-2">
            <Icons.Headphones className="w-5 h-5" /> ミニ実験：ファミレスでの聞き取り
          </h3>
          
          <div className="space-y-6">
            {/* スライダー群 */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="bg-blue-50 p-4 rounded-xl border border-blue-200">
                <label className="flex justify-between font-bold text-blue-800 mb-2">
                  <span>🟢 シグナル (友達の声)</span>
                  <span>{signal} dB</span>
                </label>
                <input 
                  type="range" min="40" max="90" step="5" 
                  value={signal} onChange={(e) => setSignal(parseInt(e.target.value))}
                  className="text-blue-500"
                />
              </div>
              <div className="bg-slate-100 p-4 rounded-xl border border-slate-300">
                <label className="flex justify-between font-bold text-slate-700 mb-2">
                  <span>🌪 ノイズ (周りの雑談)</span>
                  <span>{noise} dB</span>
                </label>
                <input 
                  type="range" min="40" max="90" step="5" 
                  value={noise} onChange={(e) => setNoise(parseInt(e.target.value))}
                  className="text-slate-500"
                />
              </div>
            </div>

            {/* 結果 */}
            <div className={`p-6 rounded-xl border-2 transition-colors duration-300 flex flex-col md:flex-row items-center justify-between gap-4 ${statusBg}`}>
              <div>
                <div className="text-sm font-bold opacity-70 mb-1">現在の S/N 比</div>
                <div className="text-3xl font-black font-mono">
                  {signal} - {noise} = <span className={statusColor}>{snr > 0 ? '+'+snr : snr} dB</span>
                </div>
              </div>
              <div className={`font-bold text-lg flex items-center gap-2 ${statusColor}`}>
                <SpeakerIcon className="w-6 h-6" /> {message}
              </div>
            </div>
          </div>
        </div>
      );
    };


    // --- メインアプリケーション ---
    const App = () => {
      return (
        <div className="max-w-4xl mx-auto px-4 py-12">
          
          {/* ヘッダー */}
          <header className="mb-16 text-center animate-fade-in relative z-10">

            <h1 className="text-4xl md:text-5xl font-black text-slate-800 tracking-tight mb-4 drop-shadow-sm">

              <p>

              </p>
              
              <SimulatorWave />
              
              <Quiz

                options={[

                  { text: "B. スピーカーの振動を伝える「媒質」がないため、全く聞こえない", isCorrect: true, explanation: "音を伝える物質（空気や水など）を媒質（ばいしつ）と呼びます。宇宙空間にはこれがないため、音は伝わりません。ＳＦ映画の爆発音が本当は無音なのは有名な話ですね！" },

                  <li><strong>縦波（たてなみ）：</strong> 音の波。バネを押し引きした時のように、進む方向と「平行」に揺れます。ドミノ倒しをイメージすると分かりやすいですね！</li>
                </ul>

            <Section title="2. 音の高さを決める「周波数」" icon={Icons.Wave} themeColor="pink" delay="0.2s">

            </Section>

              </p>

                themeColor="green"
                question="イヤホンから流れる音楽(S)が 50dB、外の車の音(N)が 50dB のとき、S/N比はどうなる？"
                options={[
                  { text: "A. 100 dB", isCorrect: false, explanation: "S/N比は足し算ではなく、引き算で求めます。" },

                  { text: "C. 0 dB", isCorrect: true, explanation: "正解！ S(50) - N(50) = 0dB です。S/N比が0dBということは、聞きたい音と雑音が全く同じ大きさで、かなり聞き取りづらい状態を表します。" }
                ]}
              />

              <TipBox title="ノイズキャンセリングの魔法" themeColor="green">

            </Section>
            
          </main>
