<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オブジェクト指向 中間テスト対策 完全攻略アプリ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- ▼ ここを追加：TailwindのデフォルトフォントをZen Maru Gothicに設定 ▼ -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Zen Maru Gothic"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- ▼ ウェイト（太さ）を 300(細字)〜900(極太)まで追加拡張 ▼ -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* 基本フォントと行間設定 */
    body, #root {
      font-family: 'Zen Maru Gothic', sans-serif !important;
      background-color: #f8fafc;
      color: #334155;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      line-height: 1.8;
      letter-spacing: 0.02em;
    }

    /* 蛍光ペン風ハイライト */
    .highlight {
      background: linear-gradient(transparent 60%, #fef08a 60%);
      font-weight: 700;
      padding: 0 0.2rem;
      border-radius: 2px;
    }
    .highlight-blue {
      background: linear-gradient(transparent 60%, #bae6fd 60%);
      font-weight: 700;
      padding: 0 0.2rem;
      border-radius: 2px;
    }
    .highlight-pink {
      background: linear-gradient(transparent 60%, #fbcfe8 60%);
      font-weight: 700;
      padding: 0 0.2rem;
      border-radius: 2px;
    }

    /* 背景のアニメーション円 (より柔らかく) */
    .bg-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px); /* ぼかしを強くして上品に */
      z-index: -1;
      animation: float 25s infinite ease-in-out alternate;
      opacity: 0.5; /* 少し透明にしてコンテンツを目立たせる */
    }
    .circle-1 {
      width: 450px; height: 450px;
      background: #bae6fd;
      top: -100px; left: -150px;
    }
    .circle-2 {
      width: 550px; height: 550px;
      background: #e9d5ff;
      bottom: -150px; right: -150px;
      animation-delay: -7s;
    }
    .circle-3 {
      width: 350px; height: 350px;
      background: #bbf7d0;
      top: 35%; left: 20%;
      animation-duration: 25s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      50% { transform: translate(40px, 60px) scale(1.1) rotate(10deg); }
      100% { transform: translate(-30px, 30px) scale(0.95) rotate(-10deg); }
    }

    /* グラスモーフィズム（より美しく進化） */
    .glass {
      background: rgba(255, 255, 255, 0.6); /* 透明度を少し上げる */
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9); /* エッジを少し白く輝かせる */
      box-shadow: 0 10px 40px rgba(31, 38, 135, 0.05); /* 青みがかった柔らかい影 */
    }

    /* アニメーションクラス */
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .slide-down { animation: slideDown 0.4s ease-out forwards; overflow: hidden; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { max-height: 0; opacity: 0; transform: translateY(-10px); }
      to { max-height: 1000px; opacity: 1; transform: translateY(0); }
    }

    /* コードブロックのスタイル */
    pre {
      background: rgba(15, 23, 42, 0.85) !important;
      color: #f8fafc;
      border-radius: 1rem;
      padding: 1.25rem;
      overflow-x: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    code { font-family: monospace; }
    ruby { font-weight: 500; }
    rt { font-size: 0.6em; color: #64748b; }

    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Lucide風 自作SVGアイコン ---
    const IconBookOpen = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    );
    const IconPenTool = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    );
    const IconInfo = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    );
    const IconCheck = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    );
    const IconX = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconChevronLeft = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    );
    const IconTarget = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    );

    // --- 共通コンポーネント ---
    const TipBox = ({ title, children, color = "blue" }) => {
      const [isOpen, setIsOpen] = useState(false);
      const colorMap = {
        blue: "bg-blue-50/80 border-blue-200 text-blue-800 hover:bg-blue-100/80",
        purple: "bg-purple-50/80 border-purple-200 text-purple-800 hover:bg-purple-100/80",
        emerald: "bg-emerald-50/80 border-emerald-200 text-emerald-800 hover:bg-emerald-100/80"
      };
      
      return (
        <div className="bg-white/60 border rounded-2xl overflow-hidden my-5 shadow-sm backdrop-blur-sm">
          <button 
            onClick={() => setIsOpen(!isOpen)}
            className={`w-full px-5 py-4 flex items-center justify-between transition-colors font-bold ${colorMap[color]}`}
          >
            <div className="flex items-center tracking-tight">
              <IconInfo className="w-5 h-5 mr-2 opacity-80 shrink-0" />
              <span className="text-left text-sm md:text-base">{title}</span>
            </div>
            <div className={`transform transition-transform duration-300 shrink-0 ml-2 ${isOpen ? 'rotate-180' : ''}`}>▼</div>
          </button>
          {isOpen && (
            <div className="px-5 py-4 text-sm md:text-base text-slate-700 border-t border-slate-100 bg-white/40 slide-down">
              {children}
            </div>
          )}
        </div>
      );
    };

    // --- シミュレーターコンポーネント ---

    // 1. 参照渡しシミュレーター (配列)
    const ReferenceSimulator = () => {
      const [arrayA, setArrayA] = useState(["🍎", "🍊", "🍇"]);
      const [isCopied, setIsCopied] = useState(false);
      const [logs, setLogs] = useState([]);

      const handleCopy = () => {
        setIsCopied(true);
        setLogs(prev => [...prev, "> 配列B = 配列A を実行（ロッカーの鍵のコピー）"]);
      };

      const handleChangeB = () => {
        if (!isCopied) return;
        const newArray = [...arrayA];
        newArray[0] = "🍰";
        setArrayA(newArray);
        setLogs(prev => [...prev, "> B[0] = '🍰' に変更しました！"]);
      };

      return (
        <div className="bg-white/80 rounded-2xl p-6 my-6 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
            <span className="bg-gradient-to-r from-blue-400 to-indigo-500 text-white p-1 rounded mr-2 text-xs">体感</span> 配列の<ruby>参照渡<rt>さんしょうわた</rt></ruby>し
          </h4>
          <p className="text-sm text-slate-600 mb-5">
            配列などの<ruby>参照型<rt>さんしょうがた</rt></ruby>は、変数にデータではなく「実体がある住所（ロッカーの鍵）」が入ります。
          </p>
          
          <div className="flex flex-col md:flex-row gap-4 mb-4">
            <div className="flex-1 bg-slate-50 p-4 rounded-xl border text-center relative shadow-inner">
              <div className="font-bold text-blue-600 mb-2">配列 A (鍵A)</div>
              <div className="text-3xl tracking-widest">{arrayA.join("")}</div>
            </div>
            <div className="flex items-center justify-center">
              {isCopied ? <div className="text-slate-500 font-bold text-xs bg-slate-100 px-3 py-1 rounded-full border border-slate-200">🔗 同じ住所</div> : <div className="text-slate-300">...</div>}
            </div>
            <div className={`flex-1 p-4 rounded-xl border text-center transition-all ${isCopied ? 'bg-slate-50 border-slate-200 shadow-inner' : 'bg-slate-50 border-dashed border-slate-300 opacity-50'}`}>
              <div className="font-bold text-emerald-600 mb-2">配列 B (鍵B)</div>
              {isCopied ? <div className="text-3xl tracking-widest">{arrayA.join("")}</div> : <div className="text-xs text-slate-400 mt-3">まだ代入されていません</div>}
            </div>
          </div>

          <div className="flex flex-wrap gap-2 mb-4">
            <button onClick={handleCopy} disabled={isCopied} className="px-4 py-2 bg-blue-500 text-white rounded-xl text-sm font-bold shadow-md hover:bg-blue-600 disabled:opacity-50 transition active:scale-95">1. B = A を実行</button>
            <button onClick={handleChangeB} disabled={!isCopied || arrayA[0] === "🍰"} className="px-4 py-2 bg-emerald-500 text-white rounded-lg text-sm font-bold shadow-md hover:bg-emerald-600 disabled:opacity-50 transition">2. B[0]を🍰に変更</button>
            <button onClick={() => {setArrayA(["🍎", "🍊", "🍇"]); setIsCopied(false); setLogs([]);}} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-300 ml-auto transition">リセット</button>
          </div>
          {logs.length > 0 && (
            <div className="bg-slate-800 text-green-300 p-4 rounded-xl text-xs font-mono">
              {logs.map((log, i) => <div key={i}>{log}</div>)}
              {arrayA[0] === "🍰" && <div className="text-yellow-300 mt-2 pt-2 border-t border-slate-600">💡 Bを変更したのにAも「🍰」に変わった！同じロッカーを開けたからです。</div>}
            </div>
          )}
        </div>
      );
    };

    // 2. カプセル化シミュレーター
    const EncapsulationSimulator = () => {
      const [budget, setBudget] = useState(50000);
      const [logs, setLogs] = useState([]);

      const handleDirect = () => {
        setBudget(0);
        setLogs(prev => ["🚨 public: 外部の人が勝手に部費を0円に書き換えました！（横領）", ...prev]);
      };

      const handleMethod = (amount) => {
        if (budget - amount < 0) {
          setLogs(prev => ["❌ private: 残高不足のため出金メソッドが拒否しました。", ...prev]);
        } else {
          setBudget(b => b - amount);
          setLogs(prev => [`✅ private: 出金メソッドを通し ${amount}円 を引き出しました。`, ...prev]);
        }
      };

      return (
        <div className="bg-white/80 rounded-2xl p-6 my-6 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
             <span className="bg-gradient-to-r from-purple-400 to-pink-500 text-white p-1 rounded mr-2 text-xs">体感</span> <ruby>カプセル化<rt>か</rt></ruby>による防御
          </h4>
          <p className="text-sm text-slate-600 mb-5">
            部活の部費を <code className="text-red-500 font-bold bg-red-50 px-1 rounded">public</code> に放置するか、<code className="text-blue-500 font-bold bg-blue-50 px-1 rounded">private</code> にして窓口（メソッド）を通すかの違いです。
          </p>

          <div className="flex justify-center mb-6">
            <div className="bg-slate-50 px-10 py-5 rounded-full shadow-inner border text-center">
              <div className="text-slate-500 text-xs font-bold mb-1">現在の部費</div>
              <div className="text-3xl font-bold text-slate-800">¥ {budget.toLocaleString()}</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div className="bg-red-50/60 p-4 rounded-xl border border-red-200">
              <button onClick={handleDirect} className="w-full py-2 bg-white text-red-600 border border-red-300 rounded-lg text-sm font-bold shadow-sm hover:bg-red-50 transition">
                public（部費 = 0; を直接実行）
              </button>
            </div>
            <div className="bg-blue-50/60 p-4 rounded-xl border border-blue-200">
              <button onClick={() => handleMethod(20000)} className="w-full py-2 bg-white text-blue-600 border border-blue-300 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-50 transition">
                private（出金メソッドを使う）
              </button>
            </div>
          </div>

          <div className="flex justify-end mb-2">
            <button onClick={() => {setBudget(50000); setLogs([]);}} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">リセット</button>
          </div>
          <div className="bg-slate-800 text-slate-300 p-4 rounded-xl text-xs font-mono h-28 overflow-y-auto">
            {logs.length === 0 ? "ログがここに表示されます。" : logs.map((l, i) => <div key={i} className={l.includes('🚨') ? 'text-red-400' : l.includes('✅') ? 'text-green-400' : 'text-yellow-400'}>{l}</div>)}
          </div>
        </div>
      );
    }

    // 3. Staticシミュレーター
    const StaticSimulator = () => {
      const [tickets, setTickets] = useState([]);
      const [totalSold, setTotalSold] = useState(0);

      const buyTicket = () => {
        const id = tickets.length + 1;
        const seat = ["A", "B", "C"][Math.floor(Math.random()*3)] + "-" + (Math.floor(Math.random()*50)+1);
        setTickets([...tickets, { id, seat }]);
        setTotalSold(prev => prev + 1);
      };

      return (
        <div className="bg-white/80 rounded-2xl p-6 my-6 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
            <span className="bg-gradient-to-r from-orange-400 to-red-500 text-white p-1 rounded mr-2 text-xs">体感</span> <ruby>静的<rt>せいてき</rt></ruby>変数 (static)
          </h4>
          <p className="text-sm text-slate-600 mb-5">
            <code className="bg-slate-100 px-1 rounded text-orange-600 font-bold">static</code> は、個別のチケット（インスタンス）ではなく、「文化祭の受付全体（クラス）」で共有される変数です。
          </p>

          <div className="flex flex-col md:flex-row gap-4 mb-4">
            <div className="w-full md:w-1/3 bg-orange-50 p-5 rounded-xl border border-orange-200 flex flex-col justify-center items-center text-center">
              <div className="text-xs font-bold text-orange-800 mb-1">Ticket.sum (static)</div>
              <div className="text-slate-500 text-[10px] mb-2">受付全体の累計発行枚数</div>
              <div className="text-4xl font-bold text-orange-600">{totalSold}</div>
              <button onClick={buyTicket} className="mt-4 px-4 py-2 bg-orange-500 text-white rounded-lg text-sm font-bold shadow-md hover:bg-orange-600 transition">チケット発券</button>
            </div>

            <div className="w-full md:w-2/3 bg-slate-50 p-5 rounded-xl border border-slate-200">
               <div className="text-xs font-bold text-slate-700 mb-1">ticket.seat (インスタンス変数)</div>
               <div className="text-slate-500 text-[10px] mb-3">各チケットが個別に持つ座席番号</div>
               <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                 {tickets.length === 0 && <div className="text-sm text-slate-400 w-full text-center py-4">まだ発券されていません</div>}
                 {tickets.map(t => (
                   <div key={t.id} className="bg-white border border-slate-200 rounded-lg p-2 text-center shadow-sm w-20 fade-in">
                     <div className="text-[10px] text-slate-400">枚目: {t.id}</div>
                     <div className="font-bold text-slate-700">{t.seat}</div>
                   </div>
                 ))}
               </div>
            </div>
          </div>
          <div className="flex justify-end">
            <button onClick={() => {setTickets([]); setTotalSold(0);}} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">リセット</button>
          </div>
        </div>
      );
    };

    // 4. クラス型変数の値渡しと参照渡しシミュレーター (新規追加)
    const ClassReferenceSimulator = () => {
      const [carOrgNum, setCarOrgNum] = useState(1111);
      const [carArray0Num, setCarArray0Num] = useState(1111);
      const [step, setStep] = useState(0);

      const handleStep1 = () => {
        setCarOrgNum(3333);
        setCarArray0Num(3333); // 同じ参照を見ているため同時に変わる
        setStep(1);
      };

      const handleReset = () => {
        setCarOrgNum(1111);
        setCarArray0Num(1111);
        setStep(0);
      };

      return (
        <div className="bg-white/80 rounded-2xl p-6 my-6 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
            <span className="bg-gradient-to-r from-teal-400 to-emerald-500 text-white p-1 rounded mr-2 text-xs">体感</span> クラス型変数の参照渡し
          </h4>
          <p className="text-sm text-slate-600 mb-5">
            クラス型のオブジェクトを別の変数や配列に代入すると、<strong>実体のコピーではなく、住所（参照）が渡されます。</strong>（第6回 過去問頻出）
          </p>
          
          <pre className="mb-4">
<code>Car org = new Car(1111, 50.0);
Car[] cars = new Car[2];
cars[0] = org; <span className="text-slate-400">// 住所が渡される</span>
<span className={step >= 1 ? "text-yellow-300 font-bold" : "text-slate-400"}>org.setNum(3333); // orgのナンバーを変更</span></code>
          </pre>

          <div className="flex gap-4 mb-4">
            <div className="flex-1 bg-slate-50 border p-4 rounded-xl text-center">
              <div className="text-xs font-bold text-slate-500 mb-1">org.num</div>
              <div className={`text-2xl font-bold ${step >= 1 ? 'text-teal-600' : 'text-slate-700'}`}>{carOrgNum}</div>
            </div>
            <div className="flex items-center justify-center text-slate-400 font-bold text-xl">=</div>
            <div className="flex-1 bg-slate-50 border p-4 rounded-xl text-center">
              <div className="text-xs font-bold text-slate-500 mb-1">cars[0].num</div>
              <div className={`text-2xl font-bold ${step >= 1 ? 'text-teal-600' : 'text-slate-700'}`}>{carArray0Num}</div>
            </div>
          </div>

          <div className="flex justify-between items-center">
            <button onClick={handleStep1} disabled={step >= 1} className="px-5 py-2 bg-teal-500 text-white rounded-lg text-sm font-bold shadow-md hover:bg-teal-600 disabled:opacity-50 transition">orgのナンバーを3333に変更</button>
            <button onClick={handleReset} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">リセット</button>
          </div>
          {step >= 1 && (
            <div className="mt-4 p-3 bg-teal-50 border border-teal-200 rounded-lg text-sm text-teal-800 fade-in font-bold">
              💡 orgを変更しただけで、cars[0]のナンバーも3333に変わりました！<br/>代入時（cars[0] = org）に渡されたのは「実体」ではなく「参照先の住所」だからです。
            </div>
          )}
        </div>
      );
    }

    // --- Study Mode ---
    const StudyMode = () => {
      return (
        <div className="fade-in space-y-8 pb-28">
          <header className="mb-8 pt-4">
            <h2 className="text-3xl font-bold tracking-tight text-slate-800 mb-3 flex items-center">
              <IconBookOpen className="w-8 h-8 mr-3 text-blue-600" />

      { cat: 'A', q: 'シフト演算子「>>>」の特徴として正しいものはどれか。', options: [{t: '符号なし右シフトであり、シフト後に空いた左端（最上位ビット）は常に「0」で埋められる。', c: true}, {t: '符号あり右シフトであり、最上位ビットは元の符号ビットと同じ値で埋められる。', c: false}, {t: '左へビットシフトし、空いた右端は「1」で埋められる。', c: false}, {t: '小数点以下を切り上げながら右へシフトする。', c: false}], exp: '「>>」は符号あり右シフト（最上位ビットは符号と同じ値で埋まる）ですが、「>>>」は符号なし右シフトであり、最上位ビットが0で埋められます。' },
      { cat: 'A', q: 'エスケープシーケンスについて、画面に「改行」と「水平タブ」を出力する組み合わせとして正しいものはどれか。', options: [{t: '改行: \\n ／ 水平タブ: \\t', c: true}, {t: '改行: \\t ／ 水平タブ: \\n', c: false}, {t: '改行: \\r ／ 水平タブ: \\b', c: false}, {t: '改行: \\f ／ 水平タブ: \\s', c: false}], exp: '\\n は改行、\\t は水平タブ、\\b はバックスペース、\\\' や \\" は引用符文字そのものを表します。' },

      { cat: 'B', q: '次の2次元配列のコードを実行したとき、最後の出力結果はどれか。\n\nint[][] mat = {{2, 3, 5}, {7, 11, 13, 17}};\nint[] tmp = mat[0];\nmat[0] = mat[1];\nmat[1] = tmp;\ntmp[2] = 99;\nSystem.out.println(mat[1][2]);', options: [{t: '99', c: true}, {t: '5', c: false}, {t: '13', c: false}, {t: '7', c: false}], exp: 'tmp と mat[1] は同じ配列 {2, 3, 5} の住所（参照）を指しています。そのため tmp[2] を 99 に変更すると、mat[1][2] も 99 に変わります。' },
      { cat: 'B', q: 'while文と do〜while文 の違いとして正しいものはどれか。', options: [{t: 'do〜while文は条件判定がブロックの最後に行われるため、条件が最初からfalseであっても最低1回は処理が実行される。', c: true}, {t: 'while文は最低1回は処理が実行されるが、do〜while文は1回も実行されないことがある。', c: false}, {t: 'do〜while文は条件式が false の間だけループを繰り返す。', c: false}, {t: '動作に違いはなく、書き方が異なるだけである。', c: false}], exp: 'while文は処理前に条件判定しますが、do〜while文は「do { 処理 } while(条件);」の順で書くため、必ず1回は処理が実行されます。' },

      { cat: 'D', q: 'メソッドに private 修飾子を付けた場合の挙動として正しいものはどれか。', options: [{t: '他のクラスからは呼び出せなくなるが、同じクラス内のコンストラクタや別メソッドからは呼び出すことができる。', c: true}, {t: '同じクラス内のコンストラクタからも一切呼び出せなくなる。', c: false}, {t: 'メソッドには private を付けることができず、コンパイルエラーになる。', c: false}, {t: 'インスタンスを生成せずに呼び出せるようになる。', c: false}], exp: 'privateメSODはクラス外からのアクセスを禁止しますが、同じクラス内（コンストラクタや内部メソッド）からであれば問題なく呼び出せます。' },

      { cat: 'REWRITE', type: 'write', ans: ['int[] b = a.clone();', 'b = a.clone();', 'a.clone()'], hint: '配列の clone() メソッドを使います', q: '【書き換え問題】\n「int[] b = a;」と書くと参照（住所）のコピーになる。配列 a の中身の実体を複製（値のコピー）して b に代入するように、右辺の「a」をメソッドを使った式に書き換えた1行（int[] b = ...;）を記述せよ。', options: [{t: 'int[] b = a.clone();', c: true}, {t: 'int[] b = Arrays.copy(a);', c: false}, {t: 'int[] b = new int[a];', c: false}, {t: 'int[] b = a.equals();', c: false}], exp: '「int[] b = a.clone();」と書き換えることで、配列の要素が別のメモリ領域に複製され、b を変更しても a に影響しなくなります。' },
      { cat: 'REWRITE', type: 'write', ans: ['System.out.println(Arrays.toString(week));', 'Arrays.toString(week)'], hint: 'Arrays.toString(配列名) を使います', q: '【書き換え問題】\n次のfor文を使わずに、Arraysクラスのメソッドを使って1行で配列 week の中身を「[月曜, 火曜, 水曜]」と出力する文（System.out.println(...);）に書き換えよ。\n\nfor(int i = 0; i < week.length; i++) {\n  System.out.println(week[i]);\n}', options: [{t: 'System.out.println(Arrays.toString(week));', c: true}, {t: 'System.out.println(week.toString());', c: false}, {t: 'System.out.println(Arrays.sort(week));', c: false}, {t: 'System.out.println(String.valueOf(week));', c: false}], exp: '「System.out.println(Arrays.toString(week));」を使うと、for文を使わずに1次元配列の全要素をまとめて文字列として出力できます（2次元配列なら Arrays.deepToString）。' },
      { cat: 'REWRITE', type: 'write', ans: ['car1.setNum(1234);', 'car1.setNum(1234)'], hint: 'car1 の setNum メソッドに引数 1234 を渡します', q: '【書き換え問題】\nCarクラスのフィールド num を private に変更（カプセル化）し、「public void setNum(int n)」メソッドを用意した。mainメソッド内の以下の1行を、メソッドを使った記述に書き換えよ。\n\n書き換え前: car1.num = 1234;', options: [{t: 'car1.setNum(1234);', c: true}, {t: 'Car.setNum(1234);', c: false}, {t: 'car1.getNum(1234);', c: false}, {t: 'car1.setNum = 1234;', c: false}], exp: 'フィールドを private にすると直接「car1.num = 1234;」とは書けなくなるため、公開メソッドを使って「car1.setNum(1234);」と書き換えます。' },
      { cat: 'REWRITE', type: 'write', ans: ['Car car1 = new Car(1234, 20.5);', 'Car car1 = new Car(1234,20.5);'], hint: 'new Car(...) のカッコ内に引数を指定します', q: '【書き換え問題】\n引数2つを受け取るコンストラクタ「Car(int n, double g)」を作成した。以下の3行の処理を、コンストラクタを使って1行のオブジェクト生成文に書き換えよ。\n\nCar car1 = new Car();\ncar1.num = 1234;\ncar1.gas = 20.5;', options: [{t: 'Car car1 = new Car(1234, 20.5);', c: true}, {t: 'Car car1(1234, 20.5) = new Car();', c: false}, {t: 'Car car1 = Car(1234, 20.5);', c: false}, {t: 'Car car1 = new Car.set(1234, 20.5);', c: false}], exp: '引数付きコンストラクタを定義しておけば、「Car car1 = new Car(1234, 20.5);」の1行でインスタンス生成と初期値の設定を同時に行えます。' },
      { cat: 'REWRITE', type: 'write', ans: ['score >= 70 ? "合格" : "不合格"', '(score >= 70) ? "合格" : "不合格"', 'String msg = score >= 70 ? "合格" : "不合格";'], hint: '条件式 ? 式1 : 式2 の形で書きます', q: '【書き換え問題】\n次のif〜else文を、条件演算子（三項演算子 ?: ）を使った1行の式に書き換える場合、空欄に入る式を記述せよ。\n\n// 書き換え前:\n// if (score >= 70) msg = "合格"; else msg = "不合格";\nString msg = 【 ここに記述 】;', options: [{t: 'score >= 70 ? "合格" : "不合格"', c: true}, {t: 'score >= 70 : "合格" ? "不合格"', c: false}, {t: '"合格" ? score >= 70 : "不合格"', c: false}, {t: 'if(score >= 70) ? "合格" : "不合格"', c: false}], exp: '条件演算子「条件式 ? trueの時の値 : falseの時の値」を使うと、「score >= 70 ? "合格" : "不合格"」と1行で簡潔に書けます。' },
      { cat: 'REWRITE', type: 'write', ans: ['catch (NumberFormatException | ArithmeticException e)', 'catch(NumberFormatException | ArithmeticException e)', 'NumberFormatException | ArithmeticException e'], hint: '2つの例外クラス名を「|」で繋ぎ、変数名 e は最後に1つだけ書きます', q: '【書き換え問題】\n次の2つのcatchブロックと全く同じ処理を、1つのcatchブロック（マルチキャッチ）にまとめて書き換えた場合の「catch (...)」の部分を記述せよ。\n\n} catch (NumberFormatException e) {\n  System.out.println("エラー");\n} catch (ArithmeticException e) {\n  System.out.println("エラー");\n}', options: [{t: 'catch (NumberFormatException | ArithmeticException e)', c: true}, {t: 'catch (NumberFormatException e | ArithmeticException e)', c: false}, {t: 'catch (NumberFormatException || ArithmeticException e)', c: false}, {t: 'catch (NumberFormatException, ArithmeticException e)', c: false}], exp: '複数の例外を1つのcatchにまとめる場合は「|」（縦棒1本）で区切り、変数は最後に1つだけ「catch (NumberFormatException | ArithmeticException e)」と書きます。' },
      { cat: 'REWRITE', type: 'write', ans: ['String str = String.valueOf(num);', 'String.valueOf(num)'], hint: 'Stringクラスの valueOf メソッドを使います', q: '【書き換え問題】\n「String str = "" + num;」は空文字との結合でint型変数 num を文字列に変換している。これを String クラスに用意されているクラスメソッドを使って変換する1文（String str = ...;）に書き換えよ。', options: [{t: 'String str = String.valueOf(num);', c: true}, {t: 'String str = String.parseInt(num);', c: false}, {t: 'String str = num.toString();', c: false}, {t: 'String str = (String)num;', c: false}], exp: '数値を文字列に変換するStringクラスのメソッドは「String.valueOf(num)」です（または「Integer.valueOf(num).toString()」でも変換可能です）。' },
    ];

    // 配列のシャッフル関数
    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    const QuizMode = () => {
      const [quizState, setQuizState] = useState('select');
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [currentOptions, setCurrentOptions] = useState([]);
      const [userInput, setUserInput] = useState('');
      const [useTextInput, setUseTextInput] = useState(true);
      
      // ▼ これを追加（初期値は分野別） ▼
      const [quizFilter, setQuizFilter] = useState('genre');

      const startQuiz = (catId) => {
        let filtered = [];
        // ▼ ALL ではなく MOCK (15問) に変更 ▼
        if (catId === 'MOCK') {
          // 記述問題を除外した選択肢問題からランダムに15問抽出
          const pool = allQuizData.filter(q => q.type !== 'write');
          filtered = shuffleArray(pool).slice(0, 15);
          setSelectedCategory({ name: '本番シミュレーション模試', desc: '全範囲ランダム 15問', icon: '🎯', color: 'text-rose-600', bg: 'bg-rose-50' });
        } else {
          filtered = allQuizData.filter(q => q.cat === catId);
          setSelectedCategory(quizCategories.find(c => c.id === catId));
        }
        
        const shuffledQuestions = shuffleArray(filtered);
        setQuestions(shuffledQuestions);
        setCurrentIndex(0);
        setScore(0);
        setIsAnswered(false);
        setSelectedOption(null);
        setUserInput('');
        setCurrentOptions(shuffleArray(shuffledQuestions[0].options));
        setQuizState('playing');
      };

      const handleOptionClick = (option) => {
        if (isAnswered) return;
        setSelectedOption(option);
        setIsAnswered(true);
        if (option.c) {
          setScore(s => s + 1);
        }
      };

      // ▼ 記述式の採点関数を追加 ▼
      const handleTextSubmit = (e) => {
        e.preventDefault();
        if (isAnswered || !userInput.trim()) return;
        const normalize = (s) => s.replace(/\s+/g, ' ').trim();
        const isCorrect = q.ans && q.ans.some(a => normalize(a) === normalize(userInput) || a.replace(/\s+/g, '') === userInput.replace(/\s+/g, ''));
        setSelectedOption({ t: userInput, c: isCorrect });
        setIsAnswered(true);
        if (isCorrect) setScore(s => s + 1);
      };

      const nextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          const nextIdx = currentIndex + 1;
          setCurrentIndex(nextIdx);
          setIsAnswered(false);
          setSelectedOption(null);
          setUserInput('');
          setCurrentOptions(shuffleArray(questions[nextIdx].options));
        } else {
          setQuizState('result');
        }
      };

      if (quizState === 'select') {
        const filteredCategories = quizCategories.filter(c => c.group === quizFilter);

        return (
          <div className="fade-in space-y-6 pb-28">
            <header className="mb-6 pt-4">
              <h2 className="text-3xl font-bold tracking-tight text-slate-800 mb-3 flex items-center">
                <IconTarget className="w-8 h-8 mr-3 text-rose-500" /> 
                実戦クイズドリル
              </h2>
              <p className="text-slate-600 text-sm md:text-base">
                出題傾向を徹底分析。分野ごとの復習や、1年分（15問）を解く本番シミュレーションを選べます。
              </p>
            </header>

            {/* ▼ タブ切り替えボタン (Segmented Control風) ▼ */}
            <div className="flex bg-slate-200/60 p-1.5 rounded-2xl mb-6 shadow-inner backdrop-blur-sm">
              <button onClick={() => setQuizFilter('genre')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${quizFilter === 'genre' ? 'bg-white shadow-sm text-blue-600 scale-100' : 'text-slate-500 hover:bg-white/40 active:scale-95'}`}>分野別</button>
              <button onClick={() => setQuizFilter('format')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${quizFilter === 'format' ? 'bg-white shadow-sm text-pink-600 scale-100' : 'text-slate-500 hover:bg-white/40 active:scale-95'}`}>出題形式別</button>
              <button onClick={() => setQuizFilter('exam')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${quizFilter === 'exam' ? 'bg-white shadow-sm text-rose-600 scale-100' : 'text-slate-500 hover:bg-white/40 active:scale-95'}`}>年度別・模試</button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {filteredCategories.map(cat => (
                <button 
                  key={cat.id} 
                  onClick={() => startQuiz(cat.id)} 
                  className={`glass hover:bg-white/90 p-5 rounded-2xl transition-all duration-300 hover:-translate-y-1 hover:shadow-lg active:scale-95 group flex items-center text-left ${cat.id === 'MOCK' ? 'md:col-span-2 border-2 border-transparent hover:border-rose-300' : ''}`}
                >
                  <div className={`text-3xl mr-4 p-3 rounded-xl shadow-sm group-hover:scale-110 transition-transform ${cat.bg}`}>{cat.icon}</div>
                  <div>
                    <h3 className={`font-bold mb-1 transition-colors group-hover:opacity-80 ${cat.color}`}>{cat.name}</h3>
                    <p className="text-xs text-slate-500">{cat.desc}</p>
                  </div>
                </button>
              ))}
            </div>
          </div>
        );
      }

      if (quizState === 'result') {
        const percentage = Math.round((score / questions.length) * 100);
        let message = "";
        let colorClass = "";
        if (percentage === 100) { message = "完璧です！本番も満点間違いなし！🎉"; colorClass = "text-emerald-500"; }
        else if (percentage >= 80) { message = "素晴らしい理解度です！間違えた箇所を復習すれば完璧です👏"; colorClass = "text-blue-500"; }
        else if (percentage >= 60) { message = "合格ライン！「要点復習」で弱点を補強しましょう💪"; colorClass = "text-orange-500"; }
        else { message = "基礎の確認が必要です。「要点復習」をもう一度読み直してみましょう📚"; colorClass = "text-red-500"; }

        return (
          <div className="fade-in text-center py-12 pb-28">
            <div className="text-sm font-bold text-slate-500 mb-2">{selectedCategory.name}</div>
            <h2 className="text-3xl font-bold text-slate-800 mb-8 tracking-tight">結果発表</h2>
            <div className="glass inline-block p-10 rounded-full mb-6 w-52 h-52 flex items-center justify-center flex-col shadow-xl border-4 border-white relative overflow-hidden group">
               <div className="absolute inset-0 bg-slate-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div className={`text-6xl font-bold relative z-10 ${colorClass}`}>{score}<span className="text-3xl text-slate-300">/{questions.length}</span></div>
            </div>
            <p className={`text-2xl font-bold mb-4 ${colorClass}`}>{percentage} <span className="text-lg">点</span></p>
            <p className="text-slate-600 mb-10 leading-loose px-4 max-w-md mx-auto">{message}</p>
            
            <button 
              onClick={() => setQuizState('select')}
              className="px-10 py-4 bg-slate-800 text-white font-bold rounded-xl shadow-lg hover:bg-slate-900 transition-transform hover:scale-105"
            >
              一覧に戻る
            </button>
          </div>
        );
      }

      const q = questions[currentIndex];
      
      return (
        <div className="fade-in max-w-2xl mx-auto pb-28">
          <div className="flex items-center justify-between mb-6">
            <button onClick={() => setQuizState('select')} className="text-slate-500 hover:text-slate-700 flex items-center text-sm font-bold transition-colors bg-white/50 px-3 py-2 rounded-lg border border-slate-200">
              <IconChevronLeft className="w-4 h-4 mr-1" /> やめる
            </button>
            <div className="text-sm font-bold text-slate-600 bg-white/80 px-4 py-2 rounded-lg shadow-sm border border-slate-200 flex items-center">
              <span className="mr-2 text-lg">{selectedCategory.icon}</span> 問 {currentIndex + 1} <span className="text-slate-400 mx-1">/</span> {questions.length}
            </div>
          </div>

          <div className="glass p-6 md:p-8 rounded-3xl shadow-sm mb-6 border-t-4 border-t-blue-400 relative overflow-hidden">
            <h3 className="text-base md:text-lg font-bold text-slate-800 leading-loose whitespace-pre-wrap">
              {q.q.split('`').map((part, i) => 
                i % 2 === 1 ? <code key={i} className="bg-slate-800 text-blue-200 px-2 py-0.5 rounded font-mono text-sm shadow-inner mx-0.5">{part}</code> : part
              )}
            </h3>
          </div>

          {/* ▼ 記述問題の場合は入力フォームを表示（4択への切り替えも可能） ▼ */}
          {q.type === 'write' && (
            <div className="flex justify-end mb-3">
              <button
                onClick={() => setUseTextInput(!useTextInput)}
                disabled={isAnswered}
                className="text-xs font-bold px-3 py-1.5 rounded-full bg-pink-100 text-pink-700 hover:bg-pink-200 transition disabled:opacity-50"
              >
                {useTextInput ? '💡 難しいので4択に切り替える' : '✏️ 記述入力モードに戻す'}
              </button>
            </div>
          )}

          {q.type === 'write' && useTextInput ? (
            <form onSubmit={handleTextSubmit} className="glass p-5 rounded-2xl mb-6">
              <div className="text-xs font-bold text-slate-500 mb-2">💡 ヒント: {q.hint}</div>
              <input
                type="text"
                value={userInput}
                onChange={(e) => setUserInput(e.target.value)}
                disabled={isAnswered}
                placeholder="ここにJavaコードを記述..."
                className="w-full p-4 rounded-xl border-2 border-slate-200 font-mono text-sm md:text-base focus:border-blue-500 focus:outline-none bg-slate-900 text-green-300 mb-3"
              />
              {!isAnswered && (
                <button
                  type="submit"
                  className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow hover:bg-blue-700 transition"
                >
                  解答を判定する
                </button>
              )}
              {isAnswered && (
                <div className="text-sm font-bold text-slate-700 mt-2">
                  模範解答: <code className="bg-slate-200 text-emerald-800 px-2 py-1 rounded">{q.ans[0]}</code>
                </div>
              )}
            </form>
          ) : (
            <div className="space-y-3 mb-6">
              {currentOptions.map((opt, i) => {
                let btnClass = "w-full text-left p-5 rounded-2xl border-2 transition-all font-bold text-sm md:text-base text-slate-700 leading-relaxed ";
                if (!isAnswered) {
                  btnClass += "bg-white/80 border-transparent hover:border-blue-300 hover:bg-white shadow-sm hover:-translate-y-0.5 active:scale-95";
                } else {
                  if (opt.c) {
                    btnClass += "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-md";
                  } else if (selectedOption === opt) {
                    btnClass += "bg-red-50 border-red-400 text-red-900";
                  } else {
                    btnClass += "bg-slate-50/50 border-slate-200 text-slate-400 opacity-50";
                  }
                }
                return (
                  <button key={i} onClick={() => handleOptionClick(opt)} disabled={isAnswered} className={btnClass}>
                    <div className="flex items-start">
                      <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs mr-3 shrink-0 mt-0.5 transition-colors ${!isAnswered ? 'bg-slate-200 text-slate-600' : opt.c ? 'bg-emerald-500 text-white' : selectedOption === opt ? 'bg-red-500 text-white' : 'bg-slate-200 text-slate-400'}`}>
                        {String.fromCharCode(65 + i)}
                      </span>
                      <span className="pt-0.5 font-mono">{opt.t}</span>
                      {isAnswered && opt.c && <IconCheck className="w-6 h-6 ml-auto text-emerald-600 shrink-0 mt-0.5" />}
                      {isAnswered && !opt.c && selectedOption === opt && <IconX className="w-6 h-6 ml-auto text-red-500 shrink-0 mt-0.5" />}
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {isAnswered && (
            <div className="slide-down">
              <div className={`p-6 rounded-3xl mb-6 border shadow-sm ${selectedOption.c ? 'bg-emerald-50/90 border-emerald-200' : 'bg-red-50/90 border-red-200'}`}>
                <h4 className={`font-bold text-lg mb-3 flex items-center tracking-tight ${selectedOption.c ? 'text-emerald-800' : 'text-red-800'}`}>
                  {selectedOption.c ? (
                    <><div className="bg-emerald-100 p-1.5 rounded-full mr-2"><IconCheck className="w-5 h-5" /></div> 正解！</>
                  ) : (
                    <><div className="bg-red-100 p-1.5 rounded-full mr-2"><IconX className="w-5 h-5" /></div> 不正解...</>
                  )}
                </h4>
                <div className="bg-white/70 p-5 rounded-2xl text-slate-700 text-sm md:text-base leading-loose border border-white">
                  <span className="font-bold text-slate-900 mr-2 border-b-2 border-slate-300 pb-0.5 inline-block mb-2">解説</span><br/>
                  {q.exp}
                </div>
              </div>
              
              <button 
                onClick={nextQuestion}
                className="w-full py-5 bg-slate-800 text-white font-bold rounded-2xl shadow-lg hover:bg-slate-900 transition-colors flex items-center justify-center text-lg tracking-wide"
              >
                {currentIndex + 1 < questions.length ? "次の問題へ" : "結果を見る"}
              </button>
            </div>
          )}
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('study');

      return (
        <div className="min-h-screen relative font-sans selection:bg-blue-200 selection:text-blue-900">
          {/* 背景の動く円 */}
          <div className="bg-circle circle-1"></div>
          <div className="bg-circle circle-2"></div>
          <div className="bg-circle circle-3"></div>

          {/* ヘッダー領域 */}
          <header className="pt-12 pb-8 px-6 text-center relative z-10">
            <div className="inline-block bg-white/60 px-5 py-1.5 rounded-full text-xs font-bold text-slate-600 tracking-widest mb-4 border border-white shadow-sm backdrop-blur-md">
              第1回 〜 第6回 範囲対応
            </div>
            <h1 className="text-3xl md:text-5xl font-bold text-slate-800 tracking-tight drop-shadow-sm leading-tight">
              オブジェクト指向<br/>
              <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">中間テスト 対策アプリ</span>
            </h1>
          </header>

          {/* メインコンテンツ領域 */}
          <main className="px-5 md:px-8 max-w-4xl mx-auto relative z-10">
            {activeTab === 'study' ? <StudyMode /> : <QuizMode />}
          </main>

          {/* ▼ 進化した下部固定フローティング・タブバー ▼ */}
          <nav className="fixed bottom-4 left-0 w-full z-50 px-4 pb-safe">
            <div className="glass max-w-sm mx-auto rounded-full flex justify-between p-1.5 shadow-lg border border-white/80">
              
              <button 
                onClick={() => setActiveTab('study')}
                className={`flex-1 py-3 flex items-center justify-center rounded-full transition-all duration-300 ${activeTab === 'study' ? 'bg-blue-600 text-white shadow-md scale-100' : 'text-slate-500 hover:bg-white/50 active:scale-95'}`}
              >
                <IconBookOpen className={`w-5 h-5 mr-2 transition-transform ${activeTab === 'study' ? 'animate-bounce' : ''}`} />
                <span className="text-sm font-bold tracking-widest">要点復習</span>
              </button>
              
              <button 
                onClick={() => setActiveTab('quiz')}
                className={`flex-1 py-3 flex items-center justify-center rounded-full transition-all duration-300 ${activeTab === 'quiz' ? 'bg-rose-500 text-white shadow-md scale-100' : 'text-slate-500 hover:bg-white/50 active:scale-95'}`}
              >
                <IconPenTool className={`w-5 h-5 mr-2 transition-transform ${activeTab === 'quiz' ? 'animate-bounce' : ''}`} />
                <span className="text-sm font-bold tracking-widest">実戦ドリル</span>
              </button>

            </div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
