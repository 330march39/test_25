<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オブジェクト指向 中間テスト対策アプリ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* 基本フォントと行間設定 */
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #f0fdf4;
      color: #334155;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      /* スマホでのタップハイライトを無効化 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 蛍光ペン風ハイライト */
    .highlight {
      background: linear-gradient(transparent 60%, #fef08a 60%);
      font-weight: 700;
      padding: 0 0.2rem;
    }
    .highlight-blue {
      background: linear-gradient(transparent 60%, #bae6fd 60%);
      font-weight: 700;
      padding: 0 0.2rem;
    }

    /* 背景のアニメーション円 */
    .bg-circle {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 20s infinite ease-in-out alternate;
    }
    .circle-1 {
      width: 400px; height: 400px;
      background: #bae6fd; /* パステルブルー */
      top: -100px; left: -100px;
    }
    .circle-2 {
      width: 500px; height: 500px;
      background: #fbcfe8; /* パステルピンク */
      bottom: -150px; right: -100px;
      animation-delay: -10s;
    }
    .circle-3 {
      width: 300px; height: 300px;
      background: #d9f99d; /* パステルグリーン */
      top: 40%; left: 30%;
      animation-duration: 25s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 50px) scale(1.1); }
      100% { transform: translate(-40px, 20px) scale(0.9); }
    }

    /* グラスモーフィズム */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    }

    /* アニメーションクラス */
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    .slide-down { animation: slideDown 0.3s ease-out forwards; overflow: hidden; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { max-height: 0; opacity: 0; }
      to { max-height: 800px; opacity: 1; }
    }

    /* コードブロックのスタイル */
    pre {
      background: rgba(15, 23, 42, 0.85) !important;
      color: #f8fafc;
      border-radius: 0.75rem;
      padding: 1rem;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    code {
      font-family: monospace;
    }

    /* スクロールバー非表示（モバイルライク） */
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* スマホ向け安全領域確保 */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Icons ---
    const IconBookOpen = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
    );
    const IconPlayCircle = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    );
    const IconInfo = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
    );
    const IconCheck = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
    );
    const IconX = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
    );
    const IconChevronLeft = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg>
    );
    const IconFlame = ({ className = "w-6 h-6" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z" /></svg>
    );

    // --- Helper Components ---
    const TipBox = ({ title, children }) => {
      const [isOpen, setIsOpen] = useState(false);
      return (
        <div className="bg-white/50 border border-blue-200 rounded-xl overflow-hidden my-4 shadow-sm">
          <button 
            onClick={() => setIsOpen(!isOpen)}
            className="w-full px-4 py-3 flex items-center justify-between bg-blue-50/80 hover:bg-blue-100/80 transition-colors"
          >
            <div className="flex items-center text-blue-800 font-bold tracking-tight">
              <IconInfo className="w-5 h-5 mr-2 text-blue-500 shrink-0" />
              <span className="text-left">{title}</span>
            </div>
            <div className={`transform transition-transform duration-300 shrink-0 ml-2 ${isOpen ? 'rotate-180' : ''}`}>
              ▼
            </div>
          </button>
          {isOpen && (
            <div className="px-4 py-3 text-sm text-slate-700 leading-loose border-t border-blue-100 bg-white/60 slide-down">
              {children}
            </div>
          )}
        </div>
      );
    };

    // --- Simulators ---
    
    // 1. 参照渡しシミュレーター
    const ReferenceSimulator = () => {
      const [arrayA, setArrayA] = useState(["🍎", "🍊", "🍇"]);
      const [isCopied, setIsCopied] = useState(false);
      const [logs, setLogs] = useState([]);

      const handleCopy = () => {
        setIsCopied(true);
        setLogs(prev => [...prev, "> int[] B = A; を実行しました（住所のコピー）"]);
      };

      const handleChangeB = () => {
        if (!isCopied) return;
        const newArray = [...arrayA];
        newArray[0] = "🍌";
        setArrayA(newArray);
        setLogs(prev => [...prev, "> B[0] = '🍌'; を実行しました！"]);
      };

      const handleReset = () => {
        setArrayA(["🍎", "🍊", "🍇"]);
        setIsCopied(false);
        setLogs([]);
      }

      return (
        <div className="bg-white/80 rounded-xl p-5 my-4 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
            <span className="bg-blue-100 text-blue-600 p-1 rounded mr-2 text-xs">体感</span> 配列の参照渡し
          </h4>
          <p className="text-sm text-slate-600 mb-4 leading-relaxed">
            配列は<ruby>参照型<rt>さんしょうがた</rt></ruby>。変数にはデータそのものではなく「ロッカーの鍵（住所）」が入っています。
          </p>
          
          <div className="flex flex-col md:flex-row gap-4 mb-4">
            <div className="flex-1 bg-slate-50 p-3 rounded-lg border border-slate-200 text-center">
              <div className="font-bold text-blue-600 mb-2">配列 A</div>
              <div className="text-2xl tracking-widest">{arrayA.join("")}</div>
            </div>
            
            <div className="flex items-center justify-center">
              {isCopied ? <div className="text-slate-500 font-bold text-xs bg-slate-100 px-2 py-1 rounded-full">🔗 同じ実体を参照</div> : <div className="text-slate-300">...</div>}
            </div>

            <div className={`flex-1 p-3 rounded-lg border text-center transition-all ${isCopied ? 'bg-slate-50 border-slate-200' : 'bg-slate-50 border-dashed border-slate-300 opacity-50'}`}>
              <div className="font-bold text-green-600 mb-2">配列 B</div>
              {isCopied ? (
                <div className="text-2xl tracking-widest">{arrayA.join("")}</div>
              ) : (
                <div className="text-xs text-slate-400 mt-3">まだ代入されていません</div>
              )}
            </div>
          </div>

          <div className="flex flex-wrap gap-2 mb-4">
            <button onClick={handleCopy} disabled={isCopied} className="px-4 py-2 bg-blue-500 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-blue-600 disabled:opacity-50 transition-colors">
              1. B = A;
            </button>
            <button onClick={handleChangeB} disabled={!isCopied || arrayA[0] === "🍌"} className="px-4 py-2 bg-green-500 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-green-600 disabled:opacity-50 transition-colors">
              2. B[0] を 🍌に変更
            </button>
            <button onClick={handleReset} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-bold hover:bg-slate-300 transition-colors ml-auto">
              リセット
            </button>
          </div>

          {logs.length > 0 && (
            <div className="bg-slate-800 text-green-400 p-3 rounded-lg text-xs font-mono leading-relaxed">
              {logs.map((log, i) => <div key={i}>{log}</div>)}
              {arrayA[0] === "🍌" && (
                <div className="text-yellow-300 mt-2 border-t border-slate-600 pt-2">
                  💡 Aの表示も「🍌」に変わりました！同じ実体（ロッカー）を見ているからです。
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // 2. カプセル化シミュレーター
    const EncapsulationSimulator = () => {
      const [budget, setBudget] = useState(10000);
      const [logs, setLogs] = useState([]);

      const handleDirectAccess = () => {
        setBudget(0);
        setLogs(prev => ["🚨 外部から直接 '部費 = 0' に書き換えられました！(横領)", ...prev]);
      };

      const handleMethodAccess = (amount) => {
        if (budget - amount < 0) {
          setLogs(prev => ["❌ [出金メソッド] 残高不足のため拒否されました。", ...prev]);
        } else {
          setBudget(b => b - amount);
          setLogs(prev => [`✅ [出金メソッド] ${amount}円引き出しました。`, ...prev]);
        }
      };

      return (
        <div className="bg-white/80 rounded-xl p-5 my-4 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
             <span className="bg-purple-100 text-purple-600 p-1 rounded mr-2 text-xs">体感</span> カプセル化による防御
          </h4>
          <p className="text-sm text-slate-600 mb-4 leading-relaxed">
            部費の管理です。変数を <code className="text-red-500 font-bold bg-red-50 px-1 rounded">public</code> にするか、<code className="text-blue-500 font-bold bg-blue-50 px-1 rounded">private</code> にしてメソッドを通すかの違いを見てみましょう。
          </p>

          <div className="flex justify-center mb-6">
            <div className="bg-slate-50 px-8 py-4 rounded-full shadow-inner border border-slate-200 text-center">
              <div className="text-slate-500 text-xs font-bold mb-1">現在の部費</div>
              <div className="text-3xl font-bold text-slate-800 tracking-tighter">¥ {budget.toLocaleString()}</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div className="bg-red-50/50 p-4 rounded-xl border border-red-200">
              <h5 className="font-bold text-red-700 text-sm mb-2">❌ public な場合</h5>
              <button 
                onClick={handleDirectAccess}
                className="w-full py-2 bg-white text-red-600 border border-red-300 rounded-lg text-sm font-bold shadow-sm hover:bg-red-50 transition"
              >
                部費 = 0; を直接実行
              </button>
            </div>
            
            <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-200">
              <h5 className="font-bold text-blue-700 text-sm mb-2">✅ private ＋ メソッド</h5>
              <button 
                onClick={() => handleMethodAccess(8000)}
                className="w-full py-2 bg-white text-blue-600 border border-blue-300 rounded-lg text-sm font-bold shadow-sm hover:bg-blue-50 transition"
              >
                出金メソッド(8000円)
              </button>
            </div>
          </div>

          <div className="flex justify-end mb-2">
             <button onClick={() => {setBudget(10000); setLogs([]);}} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">リセット</button>
          </div>

          <div className="bg-slate-800 text-slate-300 p-3 rounded-lg text-xs font-mono h-24 overflow-y-auto leading-relaxed">
             {logs.length === 0 ? "ログがここに表示されます。" : logs.map((l, i) => <div key={i} className={l.includes('🚨') ? 'text-red-400' : l.includes('✅') ? 'text-green-400' : 'text-yellow-400'}>{l}</div>)}
          </div>
        </div>
      );
    }

    // 3. Staticシミュレーター (新規)
    const StaticSimulator = () => {
      const [cars, setCars] = useState([]);
      const [totalProduced, setTotalProduced] = useState(0);

      const produceCar = () => {
        const newCarNum = Math.floor(Math.random() * 9000) + 1000;
        setCars([...cars, { id: cars.length + 1, num: newCarNum }]);
        setTotalProduced(prev => prev + 1); // 疑似的にstatic変数をインクリメント
      };

      return (
        <div className="bg-white/80 rounded-xl p-5 my-4 border border-slate-200 shadow-sm">
          <h4 className="font-bold text-slate-800 mb-2 tracking-tight flex items-center">
            <span className="bg-orange-100 text-orange-600 p-1 rounded mr-2 text-xs">体感</span> クラス変数(static)
          </h4>
          <p className="text-sm text-slate-600 mb-4 leading-relaxed">
            <code className="bg-slate-100 px-1 rounded text-orange-600 font-bold">static</code> を付けると、個別のインスタンス（車）ではなく、クラス全体（工場）で共有する変数になります。
          </p>

          <div className="flex flex-col md:flex-row gap-4 mb-4">
            {/* クラス変数エリア */}
            <div className="w-full md:w-1/3 bg-orange-50 p-4 rounded-xl border border-orange-200 flex flex-col justify-center items-center">
              <div className="text-xs font-bold text-orange-800 mb-1">Car.sum (static変数)</div>
              <div className="text-slate-500 text-[10px] mb-2">工場全体の累計生産数</div>
              <div className="text-4xl font-bold text-orange-600">{totalProduced} <span className="text-sm">台</span></div>
              <button 
                onClick={produceCar}
                className="mt-4 px-4 py-2 bg-orange-500 text-white rounded-lg text-sm font-bold shadow-sm hover:bg-orange-600 transition"
              >
                車を1台生産する
              </button>
            </div>

            {/* インスタンス変数エリア */}
            <div className="w-full md:w-2/3 bg-slate-50 p-4 rounded-xl border border-slate-200">
               <div className="text-xs font-bold text-slate-700 mb-1">car.num (インスタンス変数)</div>
               <div className="text-slate-500 text-[10px] mb-3">各車が個別に持つナンバー</div>
               
               <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                 {cars.length === 0 && <div className="text-sm text-slate-400 w-full text-center py-4">まだ生産されていません</div>}
                 {cars.map(c => (
                   <div key={c.id} className="bg-white border border-slate-200 rounded p-2 text-center shadow-sm w-20 fade-in">
                     <div className="text-[10px] text-slate-400">Car {c.id}</div>
                     <div className="font-mono font-bold text-slate-700">{c.num}</div>
                   </div>
                 ))}
               </div>
            </div>
          </div>
          <div className="flex justify-end">
            <button onClick={() => {setCars([]); setTotalProduced(0);}} className="px-3 py-1 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">リセット</button>
          </div>
        </div>
      );
    };

    // --- Study Mode ---
    const StudyMode = () => {
      return (
        <div className="fade-in space-y-6 pb-24">
          <header className="mb-6">
            <h2 className="text-2xl font-bold tracking-tight text-slate-800 mb-2 flex items-center">
              <IconBookOpen className="w-7 h-7 mr-2 text-blue-600" /> 
              要点解説（第1回〜第6回）
            </h2>
            <p className="text-slate-600 leading-loose text-sm">
              テスト範囲である「第1回〜第6回」の講義資料の内容をまとめました。丸暗記ではなく、<span className="highlight">自分事</span>として理解しましょう。
            </p>
          </header>

          <section className="glass p-6 rounded-2xl">
            <h3 className="text-lg font-bold tracking-tight text-blue-800 border-b-2 border-blue-200 pb-2 mb-4">1. オブジェクト指向の基本 (第1回)</h3>
            <p className="text-sm leading-loose text-slate-700 mb-4">
              オブジェクト指向は「ゲーム開発などで複数人が分担して作るのに向いている」手法です。
            </p>
            <ul className="list-disc pl-5 space-y-2 text-sm text-slate-700 mb-4">
              <li><span className="font-bold text-slate-800">クラス</span>: 「文化祭の模擬店のマニュアル（設計書）」。属性（フィールド）と操作（メソッド）を持ちます。</li>
              <li><span className="font-bold text-slate-800">インスタンス</span>: マニュアルを見て実際に作った「たこ焼き（実体）」。<code className="bg-slate-200 px-1 rounded">new</code> で生成されます。</li>
            </ul>
            <TipBox title="コンパイルと実行">
              Javaは <code className="text-blue-600 font-bold">javac</code> コマンドでソースコード(.java)を翻訳し、<code className="text-blue-600 font-bold">.class</code> ファイル（バイトコード）を作成します。<br/>
              その後 <code className="text-green-600 font-bold">java</code> コマンドで実行します。
            </TipBox>
          </section>

          <section className="glass p-6 rounded-2xl">
            <h3 className="text-lg font-bold tracking-tight text-emerald-800 border-b-2 border-emerald-200 pb-2 mb-4">2. 型変換と演算・制御構文 (第2回)</h3>
            <p className="text-sm leading-loose text-slate-700 mb-4">
              Javaには <code className="font-bold">int</code>(整数) や <code className="font-bold">double</code>(小数) などの「基本型」があります。
            </p>
            <ul className="list-disc pl-5 space-y-2 text-sm text-slate-700 mb-4">
              <li><span className="highlight">整数同士の割り算は切り捨て</span>になります。<code className="bg-slate-200 px-1 rounded">10 / 4</code> は <code className="font-bold text-red-500">2</code> です。正確な計算には <code className="bg-slate-200 px-1 rounded">10.0 / 4.0</code> やキャスト <code className="bg-slate-200 px-1 rounded">(double)a / b</code> が必要です。</li>
              <li>大きな型へは自動変換されますが、小さな型への代入はコンパイルエラーになります。</li>
            </ul>
            <TipBox title="例外処理 (try-catch-finally)">
              予期せぬエラー（文字入力や0除算など）でプログラムが落ちないようにする仕組みです。<br/>
              ・<code className="font-bold text-slate-800">try</code>: エラーが起きそうな処理<br/>
              ・<code className="font-bold text-slate-800">catch</code>: エラーが起きた時の処理<br/>
              ・<code className="font-bold text-slate-800">finally</code>: <span className="highlight-blue">エラーの有無に関わらず「必ず最後に」実行される処理</span>。
            </TipBox>
          </section>

          <section className="glass p-6 rounded-2xl">
            <h3 className="text-lg font-bold tracking-tight text-purple-800 border-b-2 border-purple-200 pb-2 mb-4">3. 配列と参照型 (第2・3回)</h3>
            <p className="text-sm leading-loose text-slate-700 mb-4">

    // 配列のシャッフル関数
    const shuffleArray = (array) => {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    };

    // --- Quiz Mode ---
    const QuizMode = () => {
      const [quizState, setQuizState] = useState('select'); // 'select' | 'playing' | 'result'
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [currentOptions, setCurrentOptions] = useState([]);

      const startQuiz = (catId) => {
        let filtered = [];
        if (catId === 'ALL') {
          // 全範囲からランダムに10問抽出
          filtered = shuffleArray(allQuizData).slice(0, 10);
          setSelectedCategory({ name: '全範囲 ランダム模試 (10問)', icon: '🔥' });
        } else {
          filtered = allQuizData.filter(q => q.cat === catId);
          setSelectedCategory(quizCategories.find(c => c.id === catId));
        }
        
        const shuffledQuestions = shuffleArray(filtered);
        setQuestions(shuffledQuestions);
        setCurrentIndex(0);
        setScore(0);
        setIsAnswered(false);
        setSelectedOption(null);
        setCurrentOptions(shuffleArray(shuffledQuestions[0].options));
        setQuizState('playing');
      };

      const handleOptionClick = (option) => {
        if (isAnswered) return;
        setSelectedOption(option);
        setIsAnswered(true);
        if (option.c) {
          setScore(s => s + 1);
        }
      };

      const nextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          const nextIdx = currentIndex + 1;
          setCurrentIndex(nextIdx);
          setIsAnswered(false);
          setSelectedOption(null);
          setCurrentOptions(shuffleArray(questions[nextIdx].options));
        } else {
          setQuizState('result');
        }
      };

      if (quizState === 'select') {
        return (
          <div className="fade-in space-y-6 pb-24">
            <header className="mb-8 text-center md:text-left">
              <h2 className="text-2xl font-bold tracking-tight text-slate-800 mb-2 flex items-center justify-center md:justify-start">
                <IconPlayCircle className="w-7 h-7 mr-2 text-blue-600" /> 分野別 実戦ドリル
              </h2>
              <p className="text-slate-600 leading-loose text-sm">
                中間テスト（第1回〜第6回）の範囲に特化した完全予想問題です。過去問の出題形式を徹底分析して作成しています。
              </p>
            </header>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {quizCategories.map(cat => (
                <button 
                  key={cat.id} 
                  onClick={() => startQuiz(cat.id)} 
                  className="glass hover:bg-white/90 p-5 rounded-2xl transition-all hover:-translate-y-1 group flex items-center text-left"
                >
                  <div className="text-3xl mr-4 bg-white p-3 rounded-xl shadow-sm group-hover:scale-110 transition-transform">{cat.icon}</div>
                  <div>
                    <h3 className="font-bold text-slate-800 mb-1 group-hover:text-blue-600 transition-colors">{cat.name}</h3>
                    <p className="text-xs text-slate-500">分野別ドリル (5問)</p>
                  </div>
                </button>
              ))}
              
              <button 
                onClick={() => startQuiz('ALL')} 
                className="glass hover:bg-white/90 p-5 rounded-2xl transition-all hover:-translate-y-1 md:col-span-2 border-2 border-transparent hover:border-red-300 group flex items-center"
              >
                <div className="text-3xl mr-4 bg-red-50 p-3 rounded-xl shadow-sm group-hover:scale-110 transition-transform">🔥</div>
                <div>
                  <h3 className="font-bold text-slate-800 mb-1 group-hover:text-red-600 transition-colors">全範囲 ランダム模試</h3>
                  <p className="text-xs text-slate-500">本番さながらのテスト (10問抽出)</p>
                </div>
              </button>
            </div>
          </div>
        );
      }

      if (quizState === 'result') {
        const percentage = Math.round((score / questions.length) * 100);
        let message = "";
        if (percentage === 100) message = "完璧です！この調子なら本番も満点間違いなし！🎉";
        else if (percentage >= 80) message = "素晴らしい理解度です！間違えた箇所を復習すれば完璧です👏";
        else if (percentage >= 60) message = "合格ライン！復習モードで弱点を補強しましょう。💪";
        else message = "基礎の確認が必要です。「復習モード」をもう一度読み直してみましょう📚";

        return (
          <div className="fade-in text-center py-10 pb-24">
            <div className="text-sm font-bold text-slate-500 mb-4">{selectedCategory.name}</div>
            <h2 className="text-3xl font-bold text-slate-800 mb-6">結果発表</h2>
            <div className="glass inline-block p-10 rounded-full mb-6 w-48 h-48 flex items-center justify-center flex-col shadow-lg border-4 border-white relative overflow-hidden group">
               <div className="absolute inset-0 bg-blue-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <div className="text-5xl font-bold text-blue-600 relative z-10">{score}<span className="text-2xl text-slate-400">/{questions.length}</span></div>
            </div>
            <p className="text-2xl font-bold text-slate-700 mb-3">{percentage} <span className="text-lg text-slate-500">点</span></p>
            <p className="text-slate-600 mb-10 leading-loose px-4">{message}</p>
            
            <button 
              onClick={() => setQuizState('select')}
              className="px-8 py-4 bg-slate-800 text-white font-bold rounded-xl shadow-lg hover:bg-slate-900 transition-transform hover:scale-105"
            >
              一覧に戻る
            </button>
          </div>
        );
      }

      const q = questions[currentIndex];
      
      return (
        <div className="fade-in max-w-2xl mx-auto pb-24">
          <div className="flex items-center justify-between mb-4">
            <button onClick={() => setQuizState('select')} className="text-slate-500 hover:text-slate-700 flex items-center text-sm font-bold transition-colors bg-white/50 px-3 py-2 rounded-lg">
              <IconChevronLeft className="w-4 h-4 mr-1" /> やめる
            </button>
            <div className="text-sm font-bold text-slate-600 bg-white/80 px-4 py-2 rounded-lg shadow-sm border border-slate-200 flex items-center">
              <span className="mr-2">{selectedCategory.icon}</span> {currentIndex + 1} <span className="text-slate-400 mx-1">/</span> {questions.length}
            </div>
          </div>

          <div className="glass p-6 md:p-8 rounded-2xl shadow-sm mb-6 border-t-4 border-t-blue-400">
            <h3 className="text-base md:text-lg font-bold text-slate-800 leading-loose whitespace-pre-wrap">
              {q.q.split('`').map((part, i) => 
                i % 2 === 1 ? <code key={i} className="bg-slate-800 text-green-300 px-2 py-0.5 rounded font-mono text-sm shadow-inner">{part}</code> : part
              )}
            </h3>
          </div>

          <div className="space-y-3 mb-6">
            {currentOptions.map((opt, i) => {
              let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all font-bold text-sm md:text-base text-slate-700 leading-relaxed ";
              
              if (!isAnswered) {
                btnClass += "bg-white/90 border-transparent hover:border-blue-300 hover:bg-white shadow-sm hover:-translate-y-0.5";
              } else {
                if (opt.c) {
                  btnClass += "bg-green-50 border-green-500 text-green-900 shadow-sm";
                } else if (selectedOption === opt) {
                  btnClass += "bg-red-50 border-red-400 text-red-900";
                } else {
                  btnClass += "bg-slate-50/50 border-slate-200 text-slate-400 opacity-60";
                }
              }

              return (
                <button 
                  key={i} 
                  onClick={() => handleOptionClick(opt)}
                  disabled={isAnswered}
                  className={btnClass}
                >
                  <div className="flex items-start">
                    <span className={`w-7 h-7 rounded-full flex items-center justify-center text-xs mr-3 shrink-0 mt-0.5 transition-colors ${!isAnswered ? 'bg-slate-100 text-slate-500' : opt.c ? 'bg-green-500 text-white' : selectedOption === opt ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-300'}`}>
                      {String.fromCharCode(65 + i)}
                    </span>
                    <span className="pt-1">{opt.t}</span>
                    
                    {isAnswered && opt.c && <IconCheck className="w-6 h-6 ml-auto text-green-600 shrink-0 mt-0.5" />}
                    {isAnswered && !opt.c && selectedOption === opt && <IconX className="w-6 h-6 ml-auto text-red-500 shrink-0 mt-0.5" />}
                  </div>
                </button>
              );
            })}
          </div>

          {isAnswered && (
            <div className="slide-down">
              <div className={`p-5 md:p-6 rounded-2xl mb-6 border shadow-sm ${selectedOption.c ? 'bg-green-50/90 border-green-200' : 'bg-red-50/90 border-red-200'}`}>
                <h4 className={`font-bold text-lg mb-3 flex items-center ${selectedOption.c ? 'text-green-800' : 'text-red-800'}`}>
                  {selectedOption.c ? (
                    <><div className="bg-green-100 p-1.5 rounded-full mr-2"><IconCheck className="w-5 h-5" /></div> 正解！</>
                  ) : (
                    <><div className="bg-red-100 p-1.5 rounded-full mr-2"><IconX className="w-5 h-5" /></div> 不正解...</>
                  )}
                </h4>
                <div className="bg-white/60 p-4 rounded-xl text-slate-700 text-sm leading-loose border border-white">
                  <span className="font-bold text-slate-800 mr-2 border-b-2 border-blue-200 pb-0.5">解説</span><br className="md:hidden"/>
                  {q.exp}
                </div>
              </div>
              
              <button 
                onClick={nextQuestion}
                className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-700 transition-colors flex items-center justify-center text-lg"
              >
                {currentIndex + 1 < questions.length ? "次の問題へ" : "結果を見る"}
              </button>
            </div>
          )}
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('study');

      return (
        <div className="min-h-screen relative font-sans">
          {/* 背景の動く円 */}
          <div className="bg-circle circle-1"></div>
          <div className="bg-circle circle-2"></div>
          <div className="bg-circle circle-3"></div>

          {/* ヘッダー領域 */}
          <header className="pt-14 pb-8 px-6 text-center relative z-10">
            <div className="inline-block bg-white/50 px-4 py-1.5 rounded-full text-xs font-bold text-slate-600 tracking-widest mb-4 border border-white shadow-sm">
              第1回 〜 第6回 対応
            </div>
            <h1 className="text-3xl md:text-4xl font-bold text-slate-800 tracking-tighter drop-shadow-sm leading-tight">
              オブジェクト指向<br/>
              <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">中間テスト 対策アプリ</span>
            </h1>
          </header>

          {/* メインコンテンツ領域 */}
          <main className="px-4 md:px-8 max-w-4xl mx-auto relative z-10">
            {activeTab === 'study' ? <StudyMode /> : <QuizMode />}
          </main>

          {/* 下部固定タブバー */}
          <nav className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-slate-200 pb-safe z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
            <div className="flex justify-center max-w-md mx-auto relative">
              {/* アクティブインジケーター */}
              <div className={`absolute top-0 h-1 bg-blue-600 rounded-b-full transition-all duration-300 ${activeTab === 'study' ? 'left-[10%] w-[30%]' : 'left-[60%] w-[30%]'}`}></div>
              
              <button 
                onClick={() => setActiveTab('study')}
                className={`flex-1 pt-4 pb-3 flex flex-col items-center justify-center transition-colors ${activeTab === 'study' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}
              >
                <IconBookOpen className={`w-6 h-6 mb-1.5 transition-transform ${activeTab === 'study' ? 'scale-110' : ''}`} />
                <span className="text-[11px] font-bold tracking-wider">要点復習</span>
              </button>
              
              <button 
                onClick={() => setActiveTab('quiz')}
                className={`flex-1 pt-4 pb-3 flex flex-col items-center justify-center transition-colors ${activeTab === 'quiz' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}
              >
                <IconFlame className={`w-6 h-6 mb-1.5 transition-transform ${activeTab === 'quiz' ? 'scale-110' : ''}`} />
                <span className="text-[11px] font-bold tracking-wider">実戦ドリル</span>
              </button>
            </div>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
