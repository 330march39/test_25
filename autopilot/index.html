<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ParkVision Autopilot — 駐車軌道＆ハンドル操作シミュレーター</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
                    },
                    colors: {
                        tesla: {
                            blue: '#3e6ae1',
                            cyan: '#00d2ff',
                            red: '#e82127',
                            darkBg: '#0b0e14',
                            darkPanel: 'rgba(20, 24, 33, 0.84)',
                            lightBg: '#eef2f6',
                            lightPanel: 'rgba(255, 255, 255, 0.88)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        /* Glassmorphism panels */
        .hud-panel {
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dark .hud-panel {
            background: rgba(17, 21, 30, 0.80);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
            color: #f8fafc;
        }
        html:not(.dark) .hud-panel {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.10);
            color: #0f172a;
        }
        /* Custom range slider */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.3);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #3e6ae1;
            margin-top: -4.5px;
            box-shadow: 0 0 0 3px rgba(62, 106, 225, 0.25);
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.18);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-[#090c12] text-slate-900 dark:text-slate-100 relative w-screen h-screen overflow-hidden select-none">

    <!-- MAIN FULLSCREEN CANVAS -->
    <canvas id="simCanvas" class="block w-full h-full cursor-grab active:cursor-grabbing"></canvas>

    <!-- TOP-LEFT MINIMALIST BAR (Mode Switcher & Simple/Detail View Toggle) -->
    <div class="fixed top-4 left-4 z-20 flex items-center gap-2 pointer-events-none">
        <div class="hud-panel pointer-events-auto rounded-2xl px-3 py-1.5 flex items-center gap-2.5">
            <!-- Minimal Brand Dot -->
            <div class="flex items-center gap-2 pl-1">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]"></div>
                <span class="font-semibold tracking-tight text-xs uppercase text-slate-700 dark:text-slate-200">ParkVision</span>
            </div>

            <div class="h-3.5 w-[1px] bg-slate-300/80 dark:bg-slate-700/80"></div>

            <!-- UI Mode Switcher: Simple vs Detailed -->
            <div class="flex items-center bg-slate-200/70 dark:bg-slate-800/80 p-0.5 rounded-xl text-[11px] font-medium">
                <button id="uiSimpleBtn" onclick="setUIMode('simple')" class="px-2.5 py-1 rounded-lg bg-blue-600 text-white shadow-sm transition-all">
                    シンプル
                </button>
                <button id="uiDetailBtn" onclick="setUIMode('detail')" class="px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    詳細設定
                </button>
            </div>

            <!-- Parking Type Switcher (Shown in Detail mode or compactly) -->
            <div id="parkingTypePill" class="hidden sm:flex items-center bg-slate-200/70 dark:bg-slate-800/80 p-0.5 rounded-xl text-[11px] font-medium">
                <button id="modePerpBtn" onclick="setParkingType('perpendicular')" class="px-2.5 py-1 rounded-lg bg-slate-900/10 dark:bg-white/10 text-slate-900 dark:text-white transition-all">
                    並列
                </button>
                <button id="modeParallelBtn" onclick="setParkingType('parallel')" class="px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    縦列
                </button>
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggleBtn" onclick="toggleTheme()" title="テーマ切替" class="w-7 h-7 rounded-xl flex items-center justify-center bg-slate-200/70 dark:bg-slate-800/80 hover:bg-slate-300/70 dark:hover:bg-slate-700 transition">
                <i id="themeIcon" class="fa-solid fa-sun text-amber-400 text-xs"></i>
            </button>
        </div>
    </div>

    <!-- IMPOSSIBLE TO PARK ALERT PILL (Only visible when path is blocked / impossible) -->
    <div id="impossibleBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-30 pointer-events-none hidden">
        <div class="hud-panel rounded-2xl px-4 py-2 border border-rose-500/40 bg-rose-950/80 text-rose-100 flex items-center gap-2.5 shadow-lg">
            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-sm"></i>
            <span id="impossibleReasonText" class="text-xs font-medium tracking-wide">駐車不可：スペース不足または障害物に干渉します</span>
        </div>
    </div>

    <!-- TOP-RIGHT HUD: ULTRA-CLEAN STEERING & CONTROLS -->
    <div class="fixed top-4 right-4 z-20 flex flex-col gap-2.5 w-68 sm:w-76 max-h-[calc(100vh-32px)] overflow-y-auto pr-0.5">
        
        <!-- 1. CORE CONTROLLER CARD (Always visible in both Simple and Detail modes) -->
        <div class="hud-panel rounded-3xl p-4 flex flex-col gap-3.5">
            
            <!-- Top Row: Gear PRND + Status Badge -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-1 font-mono text-xs font-bold bg-slate-200/60 dark:bg-slate-800/70 p-1 rounded-xl">
                    <span id="gearP" class="px-2 py-0.5 rounded-lg bg-blue-600 text-white transition-all">P</span>
                    <span id="gearR" class="px-2 py-0.5 rounded-lg text-slate-400 dark:text-slate-600 transition-all">R</span>
                    <span id="gearN" class="px-2 py-0.5 rounded-lg text-slate-400 dark:text-slate-600 transition-all">N</span>
                    <span id="gearD" class="px-2 py-0.5 rounded-lg text-slate-400 dark:text-slate-600 transition-all">D</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span id="kTurnBadge" class="text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                        切返 0回
                    </span>
                </div>
            </div>

            <!-- Center Row: Steering Wheel & Live Angle -->
            <div class="flex items-center gap-4 py-1">
                <div class="relative w-24 h-24 shrink-0 flex items-center justify-center bg-slate-200/40 dark:bg-slate-900/50 rounded-full border border-slate-300/40 dark:border-slate-800/80">
                    <!-- Circular turn gauge ring -->
                    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2.5" class="text-slate-300/30 dark:text-slate-800" />
                        <circle id="steerArc" cx="50" cy="50" r="45" fill="none" stroke="#3e6ae1" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="282.74" />
                    </svg>
                    
                    <!-- Minimalist Tesla-Style Steering Wheel SVG -->
                    <svg id="steeringWheelSvg" class="w-20 h-20" viewBox="0 0 120 120">
                        <defs>
                            <linearGradient id="wheelRimGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#475569"/>
                                <stop offset="100%" stop-color="#0f172a"/>
                            </linearGradient>
                            <linearGradient id="centerPadGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#334155"/>
                                <stop offset="100%" stop-color="#1e293b"/>
                            </linearGradient>
                        </defs>
                        <circle cx="60" cy="60" r="46" fill="none" stroke="url(#wheelRimGrad)" stroke-width="10.5" />
                        <path d="M 19 56 L 44 53 L 44 67 L 21 65 Z" fill="url(#centerPadGrad)" />
                        <path d="M 101 56 L 76 53 L 76 67 L 99 65 Z" fill="url(#centerPadGrad)" />
                        <path d="M 54 72 L 66 72 L 64 103 L 56 103 Z" fill="url(#centerPadGrad)" />
                        <circle cx="60" cy="60" r="18" fill="url(#centerPadGrad)" stroke="#64748b" stroke-width="1"/>
                        <!-- Top 12-o'clock indicator -->
                        <rect x="57" y="9" width="6" height="10" rx="2" fill="#3b82f6" stroke="#ffffff" stroke-width="0.8"/>
                    </svg>
                </div>

                <!-- Clean Numeric Readout -->
                <div class="flex-1 flex flex-col justify-center">
                    <div class="flex items-center justify-between text-[11px] text-slate-400 mb-0.5">
    <span>STEERING</span>
    <span id="steerDirectionLabel" class="font-semibold text-blue-500 inline-block w-20 text-right">0.0回転</span>
</div>
                    <div class="flex items-baseline gap-1.5">
                        <span id="steerWheelDegText" class="text-3xl font-mono font-bold tracking-tight">0°</span>
                    </div>
                    <!-- Minimal Left/Right Bar -->
                    <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden relative mt-2">
                        <div class="absolute left-1/2 top-0 bottom-0 w-[1.5px] bg-slate-400/60 z-10"></div>
                        <div id="steerBarFill" class="h-full bg-blue-500" style="width: 0%; margin-left: 50%;"></div>
                    </div>
                </div>
            </div>

            <!-- Scrubber Slider -->
            <div class="flex flex-col gap-1.5">
                <input id="pathScrubber" type="range" min="0" max="1000" value="0" oninput="onScrubPath(this.value)" class="w-full" />
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-12 gap-2">
                <button id="startSimBtn" onclick="toggleSimulation()" class="col-span-9 py-2.5 px-4 rounded-2xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold text-xs flex items-center justify-center gap-2 shadow-md shadow-blue-600/20 transition disabled:opacity-40 disabled:pointer-events-none disabled:bg-slate-600">
                    <i id="startSimIcon" class="fa-solid fa-play text-[11px]"></i>
                    <span id="startSimText">駐車開始</span>
                </button>
                <button onclick="replanAndResetCar()" title="初期位置へ戻す" class="col-span-3 py-2.5 rounded-2xl bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs font-medium flex items-center justify-center transition">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- 2. DETAILED SETTINGS DRAWER (Hidden in Simple Mode!) -->
        <div id="detailPanel" class="hud-panel rounded-3xl overflow-hidden hidden flex-col transition-all">
            <!-- Tabs Header -->
            <div class="grid grid-cols-2 text-[11px] font-semibold border-b border-slate-200/60 dark:border-slate-800/80 bg-slate-200/30 dark:bg-slate-900/30">
                <button onclick="switchTab('vehicle')" id="tabBtn_vehicle" class="py-2.5 text-center border-b-2 border-blue-500 text-blue-500 transition">
                    車種・プリセット
                </button>
                <button onclick="switchTab('env')" id="tabBtn_env" class="py-2.5 text-center border-b-2 border-transparent text-slate-500 dark:text-slate-400 transition">
                    駐車場・障害物
                </button>
            </div>

            <!-- TAB 1: VEHICLE & PRESETS -->
            <div id="tabContent_vehicle" class="p-4 flex flex-col gap-3.5 text-xs">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-medium text-slate-500 dark:text-slate-400 text-[11px]">車種</span>
                        <span id="carSpecLabel" class="font-mono text-[11px] text-blue-500">1.80m × 4.70m</span>
                    </div>
                    <div class="grid grid-cols-5 gap-1">
                        <button onclick="selectVehicle('kei')" id="vehBtn_kei" class="py-2 px-1 rounded-xl border border-transparent bg-slate-200/50 dark:bg-slate-800/60 flex flex-col items-center gap-0.5 hover:border-blue-400 transition">
                            <span class="text-[10px] font-semibold">軽</span>
                            <span class="text-[9px] text-slate-400">1.48</span>
                        </button>
                        <button onclick="selectVehicle('compact')" id="vehBtn_compact" class="py-2 px-1 rounded-xl border border-transparent bg-slate-200/50 dark:bg-slate-800/60 flex flex-col items-center gap-0.5 hover:border-blue-400 transition">
                            <span class="text-[10px] font-semibold">小型</span>
                            <span class="text-[9px] text-slate-400">1.69</span>
                        </button>
                        <button onclick="selectVehicle('sedan')" id="vehBtn_sedan" class="py-2 px-1 rounded-xl border border-blue-500 bg-blue-500/15 text-blue-500 flex flex-col items-center gap-0.5 transition">
                            <span class="text-[10px] font-semibold">セダン</span>
                            <span class="text-[9px] opacity-80">1.80</span>
                        </button>
                        <button onclick="selectVehicle('minivan')" id="vehBtn_minivan" class="py-2 px-1 rounded-xl border border-transparent bg-slate-200/50 dark:bg-slate-800/60 flex flex-col items-center gap-0.5 hover:border-blue-400 transition">
                            <span class="text-[10px] font-semibold">ミニバン</span>
                            <span class="text-[9px] text-slate-400">1.85</span>
                        </button>
                        <button onclick="selectVehicle('suv')" id="vehBtn_suv" class="py-2 px-1 rounded-xl border border-transparent bg-slate-200/50 dark:bg-slate-800/60 flex flex-col items-center gap-0.5 hover:border-blue-400 transition">
                            <span class="text-[10px] font-semibold">SUV</span>
                            <span class="text-[9px] text-slate-400">1.92</span>
                        </button>
                    </div>
                </div>

                <div>
                    <div class="font-medium text-slate-500 dark:text-slate-400 text-[11px] mb-1.5">配置パターン</div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="loadPreset('standard')" class="p-2 rounded-xl bg-slate-200/50 dark:bg-slate-800/60 hover:bg-blue-500/15 hover:text-blue-500 text-left transition text-[11px] font-medium">
                            標準（左バック）
                        </button>
                        <button onclick="loadPreset('narrowAisle')" class="p-2 rounded-xl bg-slate-200/50 dark:bg-slate-800/60 hover:bg-blue-500/15 hover:text-blue-500 text-left transition text-[11px] font-medium">
                            狭路（切り返し）
                        </button>
                        <button onclick="loadPreset('closeStart')" class="p-2 rounded-xl bg-slate-200/50 dark:bg-slate-800/60 hover:bg-blue-500/15 hover:text-blue-500 text-left transition text-[11px] font-medium">
                            枠に近い位置から
                        </button>
                        <button onclick="loadPreset('rightBack')" class="p-2 rounded-xl bg-slate-200/50 dark:bg-slate-800/60 hover:bg-blue-500/15 hover:text-blue-500 text-left transition text-[11px] font-medium">
                            右バック進入
                        </button>
                    </div>
                </div>

                <!-- Speed & Visual Toggles -->
                <div class="pt-2 border-t border-slate-200/50 dark:border-slate-800 flex items-center justify-between text-[11px]">
                    <span class="text-slate-400">再生速度</span>
                    <div class="flex items-center gap-1">
                        <button onclick="setSimSpeed(0.6)" id="spd06" class="px-2 py-0.5 rounded-lg text-[10px] bg-slate-200/70 dark:bg-slate-800">0.6x</button>
                        <button onclick="setSimSpeed(1.0)" id="spd10" class="px-2 py-0.5 rounded-lg text-[10px] bg-blue-600 text-white font-semibold">1.0x</button>
                        <button onclick="setSimSpeed(1.6)" id="spd16" class="px-2 py-0.5 rounded-lg text-[10px] bg-slate-200/70 dark:bg-slate-800">1.6x</button>
                    </div>
                </div>

                <div class="flex flex-wrap gap-3 text-[11px] text-slate-500 dark:text-slate-400">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="chkGhostCars" checked onchange="updateVisualOptions()" class="rounded text-blue-600">
                        <span>車体ゴースト</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="chkWheelTracks" onchange="updateVisualOptions()" class="rounded text-blue-600">
                        <span>内輪差ライン</span>
                    </label>
                </div>
            </div>

            <!-- TAB 2: LOT DIMENSIONS & OBSTACLES -->
            <div id="tabContent_env" class="p-4 hidden flex-col gap-3.5 text-xs">
                <div>
                    <div class="flex justify-between text-[11px] mb-1">
                        <span class="text-slate-500 dark:text-slate-400">前の道路幅</span>
                        <span id="roadWidthVal" class="font-mono font-semibold text-blue-500">5.6 m</span>
                    </div>
                    <input id="roadWidthSlider" type="range" min="3.4" max="8.5" step="0.1" value="5.6" oninput="onDimensionSliderChange()" class="w-full" />
                </div>

                <div>
                    <div class="flex justify-between text-[11px] mb-1">
                        <span class="text-slate-500 dark:text-slate-400">駐車枠の横幅</span>
                        <span id="spotWidthVal" class="font-mono font-semibold text-blue-500">2.50 m</span>
                    </div>
                    <input id="spotWidthSlider" type="range" min="1.8" max="3.5" step="0.05" value="2.50" oninput="onDimensionSliderChange()" class="w-full" />
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-200/50 dark:border-slate-800">
                    <span class="text-[11px] text-slate-500 dark:text-slate-400">隣の車</span>
                    <div class="flex gap-1.5">
                        <button id="toggleLeftCarBtn" onclick="toggleNeighborCar('left')" class="px-2.5 py-1 rounded-xl bg-blue-600 text-white text-[11px] font-medium transition">
                            左 あり
                        </button>
                        <button id="toggleRightCarBtn" onclick="toggleNeighborCar('right')" class="px-2.5 py-1 rounded-xl bg-blue-600 text-white text-[11px] font-medium transition">
                            右 あり
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-slate-200/50 dark:border-slate-800">
                    <span class="text-[11px] text-slate-500 dark:text-slate-400">障害物</span>
                    <div class="flex gap-1.5">
                        <button onclick="addObstacleCone()" class="px-3 py-1 rounded-xl bg-amber-500/20 text-amber-500 hover:bg-amber-500/30 font-medium text-[11px] transition">
                            + 追加
                        </button>
                        <button onclick="clearObstacles()" class="px-2.5 py-1 rounded-xl bg-slate-200/70 dark:bg-slate-800 hover:text-rose-400 text-[11px] transition">
                            クリア
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const VEHICLES = {
            kei: {
                id: 'kei',
                name: '軽自動車',
                width: 1.48,
                length: 3.40,
                wheelbase: 2.42,
                rearOverhang: 0.48,
                maxSteerRad: 37 * Math.PI / 180
            },
            compact: {
                id: 'compact',
                name: 'コンパクト',
                width: 1.69,
                length: 4.00,
                wheelbase: 2.55,
                rearOverhang: 0.68,
                maxSteerRad: 35 * Math.PI / 180
            },
            sedan: {
                id: 'sedan',
                name: 'セダン',
                width: 1.80,
                length: 4.70,
                wheelbase: 2.82,
                rearOverhang: 0.94,
                maxSteerRad: 34 * Math.PI / 180
            },
            minivan: {
                id: 'minivan',
                name: 'ミニバン',
                width: 1.85,
                length: 4.85,
                wheelbase: 2.95,
                rearOverhang: 0.98,
                maxSteerRad: 33 * Math.PI / 180
            },
            suv: {
                id: 'suv',
                name: '大型SUV',
                width: 1.92,
                length: 4.75,
                wheelbase: 2.89,
                rearOverhang: 0.93,
                maxSteerRad: 32.5 * Math.PI / 180
            }
        };

        const MAX_STEERING_WHEEL_DEG = 540; // 1.5 turns lock-to-lock

        const state = {
            darkMode: true,
            uiMode: 'simple', // 'simple' or 'detail'
            parkingType: 'perpendicular',
            vehicleKey: 'sedan',
            
            roadWidth: 5.6,
            spotWidth: 2.50,
            spotDepth: 5.30,

            startPose: {
                x: -4.2,
                y: 2.3,
                theta: 0.0
            },

            currentPose: {
                x: -4.2,
                y: 2.3,
                theta: 0.0,
                steer: 0.0,
                gear: 'P',
                isSteeringHold: false
            },

            leftNeighbor: {
                enabled: true,
                x: -2.50,
                y: -2.65,
                theta: Math.PI / 2,
                width: 1.76,
                length: 4.50
            },
            rightNeighbor: {
                enabled: true,
                x: 2.50,
                y: -2.65,
                theta: Math.PI / 2,
                width: 1.76,
                length: 4.50
            },

            obstacles: [],

            plan: {
                valid: true,
                reason: '',
                segments: [],
                flatPoints: [],
                kTurns: 1,
                minClearance: 0.45
            },

            simPlaying: false,
            simProgressIndex: 0,
            simSpeed: 1.0,

            showGhostCars: true,
            showWheelTracks: false,

            dragTarget: null,
            dragItemRef: null,
            dragOffset: { x: 0, y: 0 },
            hoveredHandle: null,

            camera: {
                pixelsPerMeter: 58,
                offsetX: 0,
                offsetY: 45
            }
        };

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        function worldToScreen(wx, wy) {
            const cx = canvas.width * 0.47 + state.camera.offsetX;
            const cy = canvas.height * 0.52 + state.camera.offsetY;
            return {
                x: cx + wx * state.camera.pixelsPerMeter,
                y: cy - wy * state.camera.pixelsPerMeter
            };
        }

        function screenToWorld(sx, sy) {
            const cx = canvas.width * 0.47 + state.camera.offsetX;
            const cy = canvas.height * 0.52 + state.camera.offsetY;
            return {
                x: (sx - cx) / state.camera.pixelsPerMeter,
                y: (cy - sy) / state.camera.pixelsPerMeter
            };
        }

        function normalizeAngle(a) {
            while (a > Math.PI) a -= 2 * Math.PI;
            while (a < -Math.PI) a += 2 * Math.PI;
            return a;
        }

        function centerToRearAxle(pose, veh) {
            const d = (veh.length / 2) - veh.rearOverhang;
            return {
                rx: pose.x - Math.cos(pose.theta) * d,
                ry: pose.y - Math.sin(pose.theta) * d,
                theta: pose.theta
            };
        }

        function rearAxleToCenter(rx, ry, theta, veh) {
            const d = (veh.length / 2) - veh.rearOverhang;
            return {
                x: rx + Math.cos(theta) * d,
                y: ry + Math.sin(theta) * d,
                theta: theta
            };
        }

        function getCarCorners(pose, width, length, margin = 0) {
            const hw = (width / 2) + margin;
            const hl = (length / 2) + margin;
            const cos = Math.cos(pose.theta);
            const sin = Math.sin(pose.theta);
            return [
                { x: pose.x + cos * hl - sin * hw, y: pose.y + sin * hl + cos * hw },
                { x: pose.x + cos * hl + sin * hw, y: pose.y + sin * hl - cos * hw },
                { x: pose.x - cos * hl + sin * hw, y: pose.y - sin * hl - cos * hw },
                { x: pose.x - cos * hl - sin * hw, y: pose.y - sin * hl + cos * hw }
            ];
        }

        function polygonsIntersect(cornersA, cornersB) {
            const polygons = [cornersA, cornersB];
            for (let i = 0; i < polygons.length; i++) {
                const poly = polygons[i];
                for (let i1 = 0; i1 < poly.length; i1++) {
                    const i2 = (i1 + 1) % poly.length;
                    const nx = poly[i2].y - poly[i1].y;
                    const ny = poly[i1].x - poly[i2].x;
                    let minA = Infinity, maxA = -Infinity;
                    for (const p of cornersA) {
                        const proj = nx * p.x + ny * p.y;
                        if (proj < minA) minA = proj;
                        if (proj > maxA) maxA = proj;
                    }
                    let minB = Infinity, maxB = -Infinity;
                    for (const p of cornersB) {
                        const proj = nx * p.x + ny * p.y;
                        if (proj < minB) minB = proj;
                        if (proj > maxB) maxB = proj;
                    }
                    if (maxA < minB || maxB < minA) return false;
                }
            }
            return true;
        }

        function distPointToCarOBB(px, py, carPose, width, length) {
            const dx = px - carPose.x;
            const dy = py - carPose.y;
            const cos = Math.cos(-carPose.theta);
            const sin = Math.sin(-carPose.theta);
            const lx = dx * cos - dy * sin;
            const ly = dx * sin + dy * cos;
            const cx = Math.max(-length / 2, Math.min(length / 2, lx));
            const cy = Math.max(-width / 2, Math.min(width / 2, ly));
            return Math.hypot(lx - cx, ly - cy);
        }

        function evaluatePoseCollision(pose, veh, safetyMargin = 0.06) {
            const corners = getCarCorners(pose, veh.width, veh.length, safetyMargin);
            let minClearance = 9.9;

            const isParallel = state.parkingType === 'parallel';
            const halfSpot = isParallel ? 3.05 : state.spotWidth / 2;
            const bayBottom = isParallel ? -2.30 : -state.spotDepth;

            // 1. Check Top Road Boundary Wall (y = state.roadWidth)
            for (const c of corners) {
                const distTop = state.roadWidth - c.y;
                if (distTop < minClearance) minClearance = distTop;
                if (c.y > state.roadWidth) {
                    return { collided: true, reason: '道路境界ラインを超えるため駐車不可', clearance: 0 };
                }
            }

            // 2. Check Bay Back Wall & Side Curbs
            for (const c of corners) {
                if (c.y < bayBottom) {
                    return { collided: true, reason: '車庫の奥壁に接触するため駐車不可', clearance: 0 };
                }
                const distBack = c.y - bayBottom;
                if (distBack < minClearance) minClearance = distBack;

                if (c.y < -0.04) {
                    if (c.x < -halfSpot || c.x > halfSpot) {
                        return { collided: true, reason: '駐車枠の境界・縁石に接触するため駐車不可', clearance: 0 };
                    }
                    minClearance = Math.min(minClearance, c.x + halfSpot, halfSpot - c.x);
                }
            }

            // Curb Entrance Corner Points (-halfSpot, 0) and (+halfSpot, 0)
            const dCurbL = distPointToCarOBB(-halfSpot, -0.04, pose, veh.width, veh.length);
            const dCurbR = distPointToCarOBB(halfSpot, -0.04, pose, veh.width, veh.length);
            minClearance = Math.min(minClearance, dCurbL, dCurbR);
            if (dCurbL < safetyMargin || dCurbR < safetyMargin) {
                return { collided: true, reason: '駐車枠の角に接触するため駐車不可', clearance: 0 };
            }

            // 3. Check Neighbor Parked Cars
            const neighbors = [];
            if (state.leftNeighbor.enabled) neighbors.push(state.leftNeighbor);
            if (state.rightNeighbor.enabled) neighbors.push(state.rightNeighbor);

            for (const nb of neighbors) {
                const nbCorners = getCarCorners(nb, nb.width, nb.length, 0.02);
                if (polygonsIntersect(corners, nbCorners)) {
                    return { collided: true, reason: '隣の駐車車両に接触するため駐車不可', clearance: 0 };
                }
                for (const nc of nbCorners) {
                    const d = distPointToCarOBB(nc.x, nc.y, pose, veh.width, veh.length);
                    if (d < minClearance) minClearance = d;
                }
            }

            // 4. Check Obstacles (Cones / Pillars)
            for (const obs of state.obstacles) {
                const dist = distPointToCarOBB(obs.x, obs.y, pose, veh.width, veh.length) - obs.radius;
                if (dist < minClearance) minClearance = dist;
                if (dist < safetyMargin) {
                    return { collided: true, reason: '障害物に接触するため駐車不可', clearance: 0 };
                }
            }

            return { collided: false, reason: '', clearance: Math.max(0, minClearance) };
        }

        function stepBicycle(pose, steerRad, distance, veh) {
            const { rx, ry, theta } = centerToRearAxle(pose, veh);
            let nrx, nry, ntheta;
            if (Math.abs(steerRad) < 1e-5) {
                nrx = rx + distance * Math.cos(theta);
                nry = ry + distance * Math.sin(theta);
                ntheta = theta;
            } else {
                const R = veh.wheelbase / Math.tan(steerRad);
                const dTheta = distance / R;
                ntheta = normalizeAngle(theta + dTheta);
                nrx = rx + R * (Math.sin(ntheta) - Math.sin(theta));
                nry = ry - R * (Math.cos(ntheta) - Math.cos(theta));
            }
            const nextCenter = rearAxleToCenter(nrx, nry, ntheta, veh);
            nextCenter.steer = steerRad;
            return nextCenter;
        }

        // Traces an exact constant-steer kinematic segment (no fake angle interpolation!)
        function sampleExactKinematicSegment(startPose, gear, steerRad, totalDist, veh, safetyMargin) {
            const dtDist = 0.05; // 5cm high-precision step
            const absDist = Math.abs(totalDist);
            const steps = Math.max(1, Math.ceil(absDist / dtDist));
            const signedStep = (gear >= 0 ? 1 : -1) * (absDist / steps);
            const points = [];
            let curr = {
                x: startPose.x,
                y: startPose.y,
                theta: startPose.theta,
                steer: steerRad,
                gear: gear > 0 ? 'D' : 'R'
            };
            let minClearance = 9.9;

            for (let i = 0; i <= steps; i++) {
                const check = evaluatePoseCollision(curr, veh, safetyMargin);
                if (check.collided) {
                    return { valid: false, reason: check.reason, points: [], minClearance: 0 };
                }
                if (check.clearance < minClearance) minClearance = check.clearance;
                points.push({ ...curr });
                if (i < steps) {
                    curr = stepBicycle(curr, steerRad, signedStep, veh);
                    curr.gear = gear > 0 ? 'D' : 'R';
                }
            }
            return { valid: true, points, endPose: points[points.length - 1], minClearance };
        }

        // Exact Reeds-Shepp style 2-arc + straight kinematic bridge between StartPose and ApexPose
        // Guarantees 100% physical kinematics and strict collision checking on every point
        function buildCollisionFreeSetupBridge(start, apexPose, veh, safetyMargin) {
            const dx = apexPose.x - start.x;
            const dy = apexPose.y - start.y;
            const dist = Math.hypot(dx, dy);
            const dTheta = Math.abs(normalizeAngle(apexPose.theta - start.theta));

            if (dist < 0.12 && dTheta < 0.05) {
                return { valid: true, segments: [], minClearance: 9.9 };
            }

            // Try connecting `start` to `apexPose` using kinematic clothoid/cubic-curvature integration
            // with both single-gear (Forward or Reverse) and 2-segment (Reverse then Forward, or Forward then Reverse) maneuvers
            const gearOptions = [1, -1];
            for (const g of gearOptions) {
                const single = tryKinematicCurveConnect(start, apexPose, g, veh, safetyMargin);
                if (single.valid) {
                    return {
                        valid: true,
                        segments: [{
                            gear: g,
                            steer: single.avgSteer,
                            points: single.points
                        }],
                        minClearance: single.minClearance
                    };
                }
            }

            // 変更後（より道路の端まで使って切り返し位置を探す）
const midYs = [
    Math.min(state.roadWidth - veh.width * 0.4, Math.max(0.8, (start.y + apexPose.y) * 0.5)),
    Math.min(state.roadWidth - veh.width * 0.6, 2.5),
    Math.min(state.roadWidth - veh.width * 0.75, 1.5),
    Math.min(state.roadWidth - veh.width * 0.4, 3.5)
];
const midXs = [(start.x + apexPose.x) * 0.5, apexPose.x * 0.6, start.x * 0.5, apexPose.x * 0.2];

            for (const my of midYs) {
                for (const mx of midXs) {
                    for (const midTheta of [0, Math.PI]) {
                        if (Math.abs( normalizeAngle(midTheta - start.theta) ) > 1.8) continue;
                        const midPose = { x: mx, y: my, theta: midTheta };
                        for (const g1 of [-1, 1]) {
                            const leg1 = tryKinematicCurveConnect(start, midPose, g1, veh, safetyMargin);
                            if (!leg1.valid) continue;
                            for (const g2 of [1, -1]) {
                                const leg2 = tryKinematicCurveConnect(leg1.endPose, apexPose, g2, veh, safetyMargin);
                                if (leg2.valid) {
                                    return {
                                        valid: true,
                                        segments: [
                                            { gear: g1, steer: leg1.avgSteer, points: leg1.points },
                                            { gear: g2, steer: leg2.avgSteer, points: leg2.points }
                                        ],
                                        minClearance: Math.min(leg1.minClearance, leg2.minClearance)
                                    };
                                }
                            }
                        }
                    }
                }
            }

            return { valid: false };
        }

        // Integrates the bicycle model along a tangent-matched path and verifies exact steering bounds & collisions
        function tryKinematicCurveConnect(pStart, pEnd, gear, veh, safetyMargin) {
            const sStart = centerToRearAxle(pStart, veh);
            const sEnd = centerToRearAxle(pEnd, veh);

            const dx = sEnd.rx - sStart.rx;
            const dy = sEnd.ry - sStart.ry;
            const dist = Math.hypot(dx, dy);
            if (dist < 0.08) return { valid: false };

            // Check if motion direction matches gear roughly
            const headDot = dx * Math.cos(sStart.theta) + dy * Math.sin(sStart.theta);
            if (gear * headDot < -0.35 * dist) return { valid: false };

            const scales = [0.42, 0.30, 0.55];
            for (const sc of scales) {
                const tanLen = Math.max(0.5, dist * sc);
                const p0 = { x: sStart.rx, y: sStart.ry };
                const p3 = { x: sEnd.rx, y: sEnd.ry };
                const p1 = {
                    x: sStart.rx + gear * Math.cos(sStart.theta) * tanLen,
                    y: sStart.ry + gear * Math.sin(sStart.theta) * tanLen
                };
                const p2 = {
                    x: sEnd.rx - gear * Math.cos(sEnd.theta) * tanLen,
                    y: sEnd.ry - gear * Math.sin(sEnd.theta) * tanLen
                };

                const steps = Math.max(24, Math.ceil(dist / 0.05));
                const points = [];
                let minClearance = 9.9;
                let steerSum = 0;
                let valid = true;

                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    const mt = 1 - t;
                    const rx = mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x;
                    const ry = mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y;

                    const tx = 3*mt*mt*(p1.x - p0.x) + 6*mt*t*(p2.x - p1.x) + 3*t*t*(p3.x - p2.x);
                    const ty = 3*mt*mt*(p1.y - p0.y) + 6*mt*t*(p2.y - p1.y) + 3*t*t*(p3.y - p2.y);

                    const ddx = 6*mt*(p2.x - 2*p1.x + p0.x) + 6*t*(p3.x - 2*p2.x + p1.x);
                    const ddy = 6*mt*(p2.y - 2*p1.y + p0.y) + 6*t*(p3.y - 2*p2.y + p1.y);

                    let theta = Math.atan2(ty, tx);
                    if (gear < 0) theta = normalizeAngle(theta + Math.PI);
                    if (i === 0) theta = sStart.theta;
                    if (i === steps) theta = sEnd.theta;

                    const speedSq = tx * tx + ty * ty;
                    if (speedSq < 1e-5) { valid = false; break; }
                    const kappa = (tx * ddy - ty * ddx) / Math.pow(speedSq, 1.5);
                    const steer = Math.atan(veh.wheelbase * kappa * gear);

                    // Strict physical steering angle check!
                    if (Math.abs(steer) > veh.maxSteerRad * 1.03) {
                        valid = false;
                        break;
                    }

                    const cPose = rearAxleToCenter(rx, ry, theta, veh);
                    cPose.steer = Math.max(-veh.maxSteerRad, Math.min(veh.maxSteerRad, steer));
                    cPose.gear = gear > 0 ? 'D' : 'R';

                    const check = evaluatePoseCollision(cPose, veh, safetyMargin);
                    if (check.collided) {
                        valid = false;
                        break;
                    }
                    if (check.clearance < minClearance) minClearance = check.clearance;
                    steerSum += cPose.steer;
                    points.push(cPose);
                }

                if (valid && points.length > 1) {
                    return {
                        valid: true,
                        points,
                        endPose: points[points.length - 1],
                        avgSteer: steerSum / points.length,
                        minClearance
                    };
                }
            }
            return { valid: false };
        }

        function computeParkingPlan() {
            const veh = VEHICLES[state.vehicleKey];

            // 1. First verify if startPose itself is already colliding!
            const startCheck = evaluatePoseCollision(state.startPose, veh, 0.04);
            if (startCheck.collided) {
                applyImpossiblePlan(startCheck.reason || '開始位置で障害物または境界に接触しています');
                return;
            }

            // 2. Verify if target parking spot is physically wide enough for this vehicle
            if (state.parkingType === 'perpendicular' && state.spotWidth < veh.width + 0.16) {
                applyImpossiblePlan(`駐車枠の幅(${state.spotWidth.toFixed(2)}m)が車幅(${veh.width.toFixed(2)}m)に対して狭すぎます`);
                return;
            }

            if (state.parkingType === 'parallel') {
                computeParallelParkingPlan(veh);
            } else {
                computePerpendicularParkingPlan(veh);
            }
        }

        function computePerpendicularParkingPlan(veh) {
            const start = { ...state.startPose, steer: 0 };
            // Goal pose is 100% straight (theta = PI/2 = 90.0 deg) and centered at x = 0.0
            const goalPose = {
                x: 0.0,
                y: -state.spotDepth / 2 + 0.18,
                theta: Math.PI / 2,
                steer: 0
            };

            const goalCheck = evaluatePoseCollision(goalPose, veh, 0.05);
            if (goalCheck.collided) {
                applyImpossiblePlan(goalCheck.reason || '駐車枠内に障害物または隣車のはみ出しがあります');
                return;
            }

            // 変更後 (よりギリギリの1cmまで許容して探索する)
for (const margin of [0.08, 0.04, 0.01]) {
                const plan = trySolveExactPerpendicular(start, goalPose, veh, margin);
                if (plan && plan.valid) {
                    applyPlanToState(plan);
                    return;
                }
            }

            applyImpossiblePlan('道幅が狭すぎるか障害物が干渉するため、安全に駐車できる軌道がありません');
        }

        function trySolveExactPerpendicular(start, goalPose, veh, margin) {
            const candidates = [];

            // 変更後（探索の解像度を大幅に上げる）
    const yEntries = [-2.10, -1.85, -1.50, -1.10, -0.70, -0.30]; 
    const steerFactors = [1.0, 0.95, 0.88, 0.80, 0.75];
    const turnSides = start.x <= 0.2 ? [1, -1] : [-1, 1];

            for (const side of turnSides) {
                for (const yEntry of yEntries) {
                    const pullOutDist = Math.max(0.25, yEntry - goalPose.y);
                    const bayEntryPose = {
                        x: 0.0,
                        y: yEntry,
                        theta: Math.PI / 2,
                        steer: 0.0
                    };

                    // Verify the final straight backing segment inside the bay is collision-free
                    const revStraightCheck = sampleExactKinematicSegment(bayEntryPose, -1, 0, pullOutDist, veh, margin);
                    if (!revStraightCheck.valid) continue;

                    for (const sf of steerFactors) {
                        const curveSteer = -side * veh.maxSteerRad * sf;
                        const R = veh.wheelbase / Math.tan(Math.abs(curveSteer));

                        // CASE A: 1-Arc Reverse Entry + Straight Back-in
                        for (const sweepDeg of [90, 85, 78, 70, 60, 50, 40, 30]) {
                            const arcLen = R * (sweepDeg * Math.PI / 180);
                            // Integrate outward from bayEntryPose to find exact ApexPose
                            const traceOut = sampleExactKinematicSegment(bayEntryPose, +1, curveSteer, arcLen, veh, margin);
                            if (!traceOut.valid) continue;

                            const apexPose = traceOut.endPose;
                            const setup = buildCollisionFreeSetupBridge(start, apexPose, veh, margin);
                            if (!setup || !setup.valid) continue;

                            // Integrate inward from apexPose -> bayEntryPose -> goalPose (100% exact!)
                            const revCurve = sampleExactKinematicSegment(apexPose, -1, curveSteer, arcLen, veh, margin);
                            if (!revCurve.valid) continue;

                            const revStraight = sampleExactKinematicSegment(revCurve.endPose, -1, 0, pullOutDist, veh, margin);
                            if (!revStraight.valid) continue;

                            const segments = [
                                ...setup.segments,
                                { gear: -1, steer: curveSteer, points: revCurve.points },
                                { gear: -1, steer: 0, points: revStraight.points }
                            ];

                            candidates.push(scoreCandidatePlan(
                                segments,
                                Math.min(setup.minClearance, revCurve.minClearance, revStraight.minClearance)
                            ));
                        }

                        // CASE B: 1 K-Turn (切り返し1回追加) for narrow roads or tight obstacles
                        for (const finalSweepDeg of [65, 55, 45, 36, 25]) {
                    for (const kSweepDeg of [45, 35, 25, 18, 12]) {
                                const arcFinal = R * (finalSweepDeg * Math.PI / 180);
                                const arcK = R * (kSweepDeg * Math.PI / 180);
                                const arcFirst = R * ((90 - finalSweepDeg - kSweepDeg) * Math.PI / 180);
                                if (arcFirst < 0.4) continue;

                                // Trace backward from bayEntryPose:
                                const tFinal = sampleExactKinematicSegment(bayEntryPose, +1, curveSteer, arcFinal, veh, margin);
                                if (!tFinal.valid) continue;

                                const tKFwd = sampleExactKinematicSegment(tFinal.endPose, -1, -curveSteer, arcK, veh, margin);
                                if (!tKFwd.valid) continue;

                                const tFirst = sampleExactKinematicSegment(tKFwd.endPose, +1, curveSteer, arcFirst, veh, margin);
                                if (!tFirst.valid) continue;

                                const apexPose = tFirst.endPose;
                                const setup = buildCollisionFreeSetupBridge(start, apexPose, veh, margin);
                                if (!setup || !setup.valid) continue;

                                // Forward-in-time exact verification
                                const rev1 = sampleExactKinematicSegment(apexPose, -1, curveSteer, arcFirst, veh, margin);
                                if (!rev1.valid) continue;
                                const fwdK = sampleExactKinematicSegment(rev1.endPose, +1, -curveSteer, arcK, veh, margin);
                                if (!fwdK.valid) continue;
                                const rev2 = sampleExactKinematicSegment(fwdK.endPose, -1, curveSteer, arcFinal, veh, margin);
                                if (!rev2.valid) continue;
                                const revStraight = sampleExactKinematicSegment(rev2.endPose, -1, 0, pullOutDist, veh, margin);
                                if (!revStraight.valid) continue;

                                const segments = [
                                    ...setup.segments,
                                    { gear: -1, steer: curveSteer, points: rev1.points },
                                    { gear: +1, steer: -curveSteer, points: fwdK.points },
                                    { gear: -1, steer: curveSteer, points: rev2.points },
                                    { gear: -1, steer: 0, points: revStraight.points }
                                ];

                                candidates.push(scoreCandidatePlan(
                                    segments,
                                    Math.min(setup.minClearance, rev1.minClearance, fwdK.minClearance, rev2.minClearance, revStraight.minClearance)
                                ));
                            }
                        }

                        // CASE C: 2 K-Turns (切り返し2回追加) for very narrow aisles (e.g., 3.8m - 4.2m road width)
                        for (const s3Deg of [45, 38, 30, 20]) {
                    for (const s2Deg of [30, 22, 15]) {
                        const s1Deg = s2Deg;
                            const arc3 = R * (s3Deg * Math.PI / 180);
                            const arcK = R * (s2Deg * Math.PI / 180);

                            const t3 = sampleExactKinematicSegment(bayEntryPose, +1, curveSteer, arc3, veh, margin);
                            if (!t3.valid) continue;
                            const tk2 = sampleExactKinematicSegment(t3.endPose, -1, -curveSteer, arcK, veh, margin);
                            if (!tk2.valid) continue;
                            const t2 = sampleExactKinematicSegment(tk2.endPose, +1, curveSteer, arcK, veh, margin);
                            if (!t2.valid) continue;
                            const tk1 = sampleExactKinematicSegment(t2.endPose, -1, -curveSteer, arcK, veh, margin);
                            if (!tk1.valid) continue;
                            const t1 = sampleExactKinematicSegment(tk1.endPose, +1, curveSteer, arcK, veh, margin);
                            if (!t1.valid) continue;

                            const apexPose = t1.endPose;
                            const setup = buildCollisionFreeSetupBridge(start, apexPose, veh, margin);
                            if (!setup || !setup.valid) continue;

                            const rev1 = sampleExactKinematicSegment(apexPose, -1, curveSteer, arcK, veh, margin);
                            if (!rev1.valid) continue;
                            const fwd1 = sampleExactKinematicSegment(rev1.endPose, +1, -curveSteer, arcK, veh, margin);
                            if (!fwd1.valid) continue;
                            const rev2 = sampleExactKinematicSegment(fwd1.endPose, -1, curveSteer, arcK, veh, margin);
                            if (!rev2.valid) continue;
                            const fwd2 = sampleExactKinematicSegment(rev2.endPose, +1, -curveSteer, arcK, veh, margin);
                            if (!fwd2.valid) continue;
                            const rev3 = sampleExactKinematicSegment(fwd2.endPose, -1, curveSteer, arc3, veh, margin);
                            if (!rev3.valid) continue;
                            const revStraight = sampleExactKinematicSegment(rev3.endPose, -1, 0, pullOutDist, veh, margin);
                            if (!revStraight.valid) continue;

                            const segments = [
                                ...setup.segments,
                                { gear: -1, steer: curveSteer, points: rev1.points },
                                { gear: +1, steer: -curveSteer, points: fwd1.points },
                                { gear: -1, steer: curveSteer, points: rev2.points },
                                { gear: +1, steer: -curveSteer, points: fwd2.points },
                                { gear: -1, steer: curveSteer, points: rev3.points },
                                { gear: -1, steer: 0, points: revStraight.points }
                            ];

                            candidates.push(scoreCandidatePlan(
                                segments,
                                Math.min(setup.minClearance, rev1.minClearance, fwd1.minClearance, rev2.minClearance, rev3.minClearance)
                            ));
                        }
                    }
                }
            }

            if (candidates.length === 0) return null;
            candidates.sort((a, b) => a.cost - b.cost);
            return candidates[0];
        }

        // Exact Parallel Parking Solver (two opposite circular kinematic arcs + final straight alignment at theta = 0.0)
        function computeParallelParkingPlan(veh) {
            const start = { ...state.startPose, steer: 0 };
            const goalPose = {
                x: 0.0,
                y: -1.15,
                theta: 0.0,
                steer: 0.0
            };

            const goalCheck = evaluatePoseCollision(goalPose, veh, 0.04);
            if (goalCheck.collided) {
                applyImpossiblePlan(goalCheck.reason);
                return;
            }

            const margin = 0.04;
            const candidates = [];

            // 変更後（切り返しを含む柔軟な縦列駐車）
for (const sf of [1.0, 0.95, 0.85, 0.75]) {
    const steerMag = veh.maxSteerRad * sf;
    const R = veh.wheelbase / Math.tan(steerMag);

    for (const xBackEnd of [-0.8, -0.5, -0.35, -0.15, 0.0, 0.3]) {
        const fwdDist = Math.abs(xBackEnd);
        const backEndPose = { x: xBackEnd, y: -1.15, theta: 0.0, steer: 0 };

        for (const sweepDeg of [25, 30, 35, 40, 45, 50]) {
            const arcLen = R * (sweepDeg * Math.PI / 180);

            // ① 通常のS字バック（一発入れ）
            const outArc2 = sampleExactKinematicSegment(backEndPose, +1, +steerMag, arcLen, veh, margin);
            if (outArc2.valid) {
                const outArc1 = sampleExactKinematicSegment(outArc2.endPose, +1, -steerMag, arcLen, veh, margin);
                if (outArc1.valid) {
                    const pullUpPose = outArc1.endPose;
                    const setup = buildCollisionFreeSetupBridge(start, pullUpPose, veh, margin);
                    if (setup && setup.valid) {
                        const revArc1 = sampleExactKinematicSegment(pullUpPose, -1, -steerMag, arcLen, veh, margin);
                        if (revArc1.valid) {
                            const revArc2 = sampleExactKinematicSegment(revArc1.endPose, -1, +steerMag, arcLen, veh, margin);
                            if (revArc2.valid) {
                                const segments = [
                                    ...setup.segments,
                                    { gear: -1, steer: -steerMag, points: revArc1.points },
                                    { gear: -1, steer: +steerMag, points: revArc2.points }
                                ];
                                if (fwdDist > 0.04) {
                                    const fwdAlign = sampleExactKinematicSegment(revArc2.endPose, +1, 0, fwdDist, veh, margin);
                                    if (fwdAlign.valid) segments.push({ gear: +1, steer: 0, points: fwdAlign.points });
                                }
                                candidates.push(scoreCandidatePlan(segments, Math.min(setup.minClearance, revArc1.minClearance, revArc2.minClearance)));
                            }
                        }
                    }
                }
            }

            // ② 縦列切り返しパターン（深く斜めに入ってから、前進して真っ直ぐにする）
            const kTurnFwdDist = 0.6; // 前進で調整する距離
            const tiltedPose = sampleExactKinematicSegment(backEndPose, -1, -steerMag, kTurnFwdDist, veh, margin);
            if (!tiltedPose.valid) continue;
            
            const kOutArc2 = sampleExactKinematicSegment(tiltedPose.endPose, +1, +steerMag, arcLen, veh, margin);
            if (kOutArc2.valid) {
                const kOutArc1 = sampleExactKinematicSegment(kOutArc2.endPose, +1, -steerMag, arcLen, veh, margin);
                if (kOutArc1.valid) {
                    const setup = buildCollisionFreeSetupBridge(start, kOutArc1.endPose, veh, margin);
                    if (setup && setup.valid) {
                        const r1 = sampleExactKinematicSegment(kOutArc1.endPose, -1, -steerMag, arcLen, veh, margin);
                        if (r1.valid) {
                            const r2 = sampleExactKinematicSegment(r1.endPose, -1, +steerMag, arcLen, veh, margin);
                            if (r2.valid) {
                                const f1 = sampleExactKinematicSegment(r2.endPose, +1, -steerMag, kTurnFwdDist, veh, margin);
                                if (f1.valid) {
                                    const segments = [
                                        ...setup.segments,
                                        { gear: -1, steer: -steerMag, points: r1.points },
                                        { gear: -1, steer: +steerMag, points: r2.points },
                                        { gear: +1, steer: -steerMag, points: f1.points } // 前進切り返し
                                    ];
                                    if (fwdDist > 0.04) {
                                        const fwdAlign = sampleExactKinematicSegment(f1.endPose, +1, 0, fwdDist, veh, margin);
                                        if (fwdAlign.valid) segments.push({ gear: +1, steer: 0, points: fwdAlign.points });
                                    }
                                    candidates.push(scoreCandidatePlan(segments, Math.min(setup.minClearance, r1.minClearance, r2.minClearance, f1.minClearance)));
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

            if (candidates.length === 0) {
                applyImpossiblePlan('縦列駐車のスペースが不足しているか、障害物に接触するため駐車不可です');
                return;
            }
            candidates.sort((a, b) => a.cost - b.cost);
            applyPlanToState(candidates[0]);
        }

        function scoreCandidatePlan(segments, minClearance) {
            let gearChanges = 0;
            let totalPts = 0;
            for (let i = 0; i < segments.length; i++) {
                totalPts += segments[i].points.length;
                if (i > 0 && segments[i].gear !== segments[i - 1].gear) {
                    gearChanges++;
                }
            }
            const cost = gearChanges * 150 + totalPts * 0.6 - Math.min(0.5, minClearance) * 60;
            return {
                valid: true,
                reason: '',
                segments,
                kTurns: gearChanges,
                minClearance: Math.max(0.04, minClearance),
                cost
            };
        }

        function applyImpossiblePlan(reasonText) {
            state.plan = {
                valid: false,
                reason: reasonText,
                segments: [],
                flatPoints: [],
                kTurns: 0,
                minClearance: 0
            };
            state.simPlaying = false;
            state.simProgressIndex = 0;
            state.currentPose = { ...state.startPose, steer: 0, gear: 'P' };

            // Disable start button and show impossible banner
            const startBtn = document.getElementById('startSimBtn');
            startBtn.disabled = true;
            document.getElementById('startSimText').textContent = '駐車不可';
            document.getElementById('startSimIcon').className = 'fa-solid fa-ban text-[11px]';

            const banner = document.getElementById('impossibleBanner');
            banner.classList.remove('hidden');
            document.getElementById('impossibleReasonText').textContent = reasonText;

            const dot = document.getElementById('statusDot');
            dot.className = 'w-2 h-2 rounded-full bg-rose-500 shadow-[0_0_8px_#f43f5e]';

            document.getElementById('kTurnBadge').textContent = '駐車不可';
            document.getElementById('kTurnBadge').className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-rose-500/20 text-rose-400';

            updateHUDTelemetry();
        }

        function applyPlanToState(plan) {
            if (!plan || !plan.valid) return;
            state.plan = plan;

            const veh = VEHICLES[state.vehicleKey];
            const flat = [];
            let currentSteer = 0;

            plan.segments.forEach((seg, segIdx) => {
                const firstPt = seg.points[0];
                const targetSteer = firstPt.steer || 0;
                const steerDelta = targetSteer - currentSteer;
                const wheelDegDelta = Math.abs((steerDelta / veh.maxSteerRad) * MAX_STEERING_WHEEL_DEG);

                // When shifting gears (e.g. D -> R) or changing steering angle significantly,
                // insert stationary pause + realistic steering wheel turning frames!
                if (wheelDegDelta > 12 || segIdx > 0) {
                    const pauseFrames = segIdx > 0 ? 10 : 4; // Brief stop before turning wheel
                    const turnFrames = Math.max(8, Math.ceil(wheelDegDelta / 16)); // ~16 deg per frame steering wheel rotation speed

                    for (let p = 0; p < pauseFrames; p++) {
                        flat.push({
                            x: firstPt.x,
                            y: firstPt.y,
                            theta: firstPt.theta,
                            steer: currentSteer,
                            gear: seg.gear > 0 ? 'D' : 'R',
                            isSteeringHold: true
                        });
                    }

                    for (let k = 1; k <= turnFrames; k++) {
                        const ratio = k / turnFrames;
                        // Smooth ease-in-out steering rotation
                        const smooth = ratio * ratio * (3 - 2 * ratio);
                        flat.push({
                            x: firstPt.x,
                            y: firstPt.y,
                            theta: firstPt.theta,
                            steer: currentSteer + steerDelta * smooth,
                            gear: seg.gear > 0 ? 'D' : 'R',
                            isSteeringHold: true
                        });
                    }
                }

                // Append actual driving points of the segment
                seg.points.forEach((pt) => {
                    flat.push({
                        ...pt,
                        isSteeringHold: false
                    });
                    currentSteer = pt.steer || 0;
                });
            });

            // At the very end inside the parking spot, smoothly return steering wheel to 0 deg if not already 0
            if (flat.length > 0 && Math.abs(currentSteer) > 0.01) {
                const lastPt = flat[flat.length - 1];
                const unwindFrames = 14;
                for (let k = 1; k <= unwindFrames; k++) {
                    const r = 1 - (k / unwindFrames);
                    flat.push({
                        x: lastPt.x,
                        y: lastPt.y,
                        theta: lastPt.theta,
                        steer: currentSteer * r,
                        gear: 'P',
                        isSteeringHold: true
                    });
                }
            }

            state.plan.flatPoints = flat;

            // Enable Start Button & Clear Alert Banner
            const startBtn = document.getElementById('startSimBtn');
            startBtn.disabled = false;
            updatePlayButtonUI();

            document.getElementById('impossibleBanner').classList.add('hidden');
            const dot = document.getElementById('statusDot');
            dot.className = 'w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_#3b82f6]';

            const kBadge = document.getElementById('kTurnBadge');
            kBadge.textContent = `切返 ${plan.kTurns}回`;
            kBadge.className = 'text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-800 text-slate-600 dark:text-slate-300';

            const scrubber = document.getElementById('pathScrubber');
            scrubber.max = Math.max(1, flat.length - 1);

            if (!state.simPlaying && flat.length > 0) {
                state.simProgressIndex = 0;
                state.currentPose = { ...flat[0], gear: 'P' };
                scrubber.value = 0;
            }

            updateHUDTelemetry();
        }

        function updateHUDTelemetry() {
            const veh = VEHICLES[state.vehicleKey];
            const pose = state.currentPose;
            const wheelDeg = -((pose.steer || 0) / veh.maxSteerRad) * MAX_STEERING_WHEEL_DEG;
            const clampedWheelDeg = Math.max(-MAX_STEERING_WHEEL_DEG, Math.min(MAX_STEERING_WHEEL_DEG, wheelDeg));
            const rotations = (Math.abs(clampedWheelDeg) / 360).toFixed(1);

            // Rotate SVG Steering Wheel smoothly
            const wheelSvg = document.getElementById('steeringWheelSvg');
            wheelSvg.style.transform = `rotate(${clampedWheelDeg.toFixed(1)}deg)`;

            // Update circular gauge arc
            const arc = document.getElementById('steerArc');
            const circumference = 282.74;
            const frac = Math.min(1, Math.abs(clampedWheelDeg) / MAX_STEERING_WHEEL_DEG);
            arc.style.strokeDashoffset = (circumference * (1 - frac)).toFixed(2);
            arc.style.stroke = clampedWheelDeg > 6 ? '#f59e0b' : (clampedWheelDeg < -6 ? '#06b6d4' : '#3e6ae1');

            const absDeg = Math.round(Math.abs(clampedWheelDeg));
            document.getElementById('steerWheelDegText').textContent = `${absDeg}°`;

            const dirLabel = document.getElementById('steerDirectionLabel');
            const barFill = document.getElementById('steerBarFill');
            if (clampedWheelDeg > 5) {
                dirLabel.textContent = `右 ${rotations}回転`;
                dirLabel.className = 'font-semibold text-amber-500';
                barFill.style.marginLeft = '50%';
                barFill.style.width = `${(frac * 50).toFixed(1)}%`;
                barFill.className = 'h-full bg-amber-500';
            } else if (clampedWheelDeg < -5) {
                dirLabel.textContent = `左 ${rotations}回転`;
                dirLabel.className = 'font-semibold text-cyan-500';
                const w = frac * 50;
                barFill.style.marginLeft = `${(50 - w).toFixed(1)}%`;
                barFill.style.width = `${w.toFixed(1)}%`;
                barFill.className = 'h-full bg-cyan-500';
            } else {
                dirLabel.textContent = '0.0回転';
                dirLabel.className = 'font-semibold text-blue-500';
                barFill.style.marginLeft = '50%';
                barFill.style.width = '0%';
            }

            // Gear PRND
            ['P', 'R', 'N', 'D'].forEach(g => {
                const el = document.getElementById('gear' + g);
                if (pose.gear === g) {
                    const bg = g === 'R' ? 'bg-amber-500 text-white shadow-sm' : 'bg-blue-600 text-white shadow-sm';
                    el.className = `px-2 py-0.5 rounded-lg ${bg} transition-all`;
                } else {
                    el.className = 'px-2 py-0.5 rounded-lg text-slate-400 dark:text-slate-600 transition-all';
                }
            });
        }

        function renderScene() {
            const w = canvas.width;
            const h = canvas.height;
            const isDark = state.darkMode;

            // 1. Clean Tesla FSD Background
            ctx.fillStyle = isDark ? '#090c12' : '#e2e8f0';
            ctx.fillRect(0, 0, w, h);

            drawMetricGrid(isDark);
            drawParkingLotAndHandles(isDark);

            if (state.plan && state.plan.valid && state.plan.flatPoints.length > 1) {
                drawPlannedTrajectory(isDark);
            }

            if (state.leftNeighbor.enabled) {
                drawTopDownVehicle(state.leftNeighbor, false, isDark);
            }
            if (state.rightNeighbor.enabled) {
                drawTopDownVehicle(state.rightNeighbor, false, isDark);
            }

            drawObstacles();

            const veh = VEHICLES[state.vehicleKey];
            const egoObj = {
                ...state.currentPose,
                width: veh.width,
                length: veh.length,
                wheelbase: veh.wheelbase,
                rearOverhang: veh.rearOverhang
            };
            drawTopDownVehicle(egoObj, true, isDark);
        }

        function drawMetricGrid(isDark) {
            ctx.save();
            ctx.strokeStyle = isDark ? 'rgba(255, 255, 255, 0.025)' : 'rgba(15, 23, 42, 0.04)';
            ctx.lineWidth = 1;

            const topLeft = screenToWorld(0, 0);
            const bottomRight = screenToWorld(canvas.width, canvas.height);

            ctx.beginPath();
            for (let x = Math.floor(topLeft.x); x <= Math.ceil(bottomRight.x); x++) {
                const sx = worldToScreen(x, 0).x;
                ctx.moveTo(sx, 0);
                ctx.lineTo(sx, canvas.height);
            }
            for (let y = Math.floor(bottomRight.y); y <= Math.ceil(topLeft.y); y++) {
                const sy = worldToScreen(0, y).y;
                ctx.moveTo(0, sy);
                ctx.lineTo(canvas.width, sy);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawParkingLotAndHandles(isDark) {
            ctx.save();
            const halfSpot = state.spotWidth / 2;
            const bayDepth = state.parkingType === 'parallel' ? 2.3 : state.spotDepth;
            const bayHalfWidth = state.parkingType === 'parallel' ? 3.05 : halfSpot;

            // Road surface
            const roadTopLeft = worldToScreen(-20, state.roadWidth);
            const roadBottomRight = worldToScreen(20, 0);
            ctx.fillStyle = isDark ? '#111621' : '#cbd5e1';
            ctx.fillRect(roadTopLeft.x, roadTopLeft.y, roadBottomRight.x - roadTopLeft.x, roadBottomRight.y - roadTopLeft.y);

            // Target Bay highlight
            const bayTL = worldToScreen(-bayHalfWidth, 0);
            const bayBR = worldToScreen(bayHalfWidth, -bayDepth);
            ctx.fillStyle = state.plan.valid
                ? (isDark ? 'rgba(59, 130, 246, 0.08)' : 'rgba(59, 130, 246, 0.11)')
                : (isDark ? 'rgba(244, 63, 94, 0.08)' : 'rgba(244, 63, 94, 0.11)');
            ctx.fillRect(bayTL.x, bayTL.y, bayBR.x - bayTL.x, bayBR.y - bayTL.y);

            // Neighbor Bays
            for (let idx = -3; idx <= 3; idx++) {
                if (idx === 0) continue;
                const bLeft = idx * (bayHalfWidth * 2) - bayHalfWidth;
                const bRight = bLeft + bayHalfWidth * 2;
                const p1 = worldToScreen(bLeft, 0);
                const p2 = worldToScreen(bRight, -bayDepth);
                ctx.fillStyle = isDark ? '#0e131c' : '#d5dde7';
                ctx.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);

                ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.75)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
            }

            // Target Parking Spot Lines
            ctx.strokeStyle = state.plan.valid ? '#3b82f6' : '#f43f5e';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const cTL = worldToScreen(-bayHalfWidth, 0);
            const cBL = worldToScreen(-bayHalfWidth, -bayDepth);
            const cBR = worldToScreen(bayHalfWidth, -bayDepth);
            const cTR = worldToScreen(bayHalfWidth, 0);
            ctx.moveTo(cTL.x, cTL.y);
            ctx.lineTo(cBL.x, cBL.y);
            ctx.lineTo(cBR.x, cBR.y);
            ctx.lineTo(cTR.x, cTR.y);
            ctx.stroke();

            // Minimalist "P" inside target bay (No noisy text!)
            const spotCenter = worldToScreen(0, -bayDepth * 0.52);
            ctx.fillStyle = state.plan.valid
                ? (isDark ? 'rgba(59, 130, 246, 0.28)' : 'rgba(37, 99, 235, 0.25)')
                : 'rgba(244, 63, 94, 0.35)';
            ctx.font = '600 26px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('P', spotCenter.x, spotCenter.y);

            // Top Opposite Road Boundary Line
            const wallY = roadTopLeft.y;
            const isHoverWall = state.hoveredHandle === 'roadWall' || state.dragTarget === 'roadWall';
            ctx.strokeStyle = isHoverWall ? '#38bdf8' : (isDark ? '#334155' : '#64748b');
            ctx.lineWidth = isHoverWall ? 4 : 2.5;
            ctx.beginPath();
            ctx.moveTo(0, wallY);
            ctx.lineTo(canvas.width, wallY);
            ctx.stroke();

            // Minimalist Grip Handle on Top Road Wall (Shows dimension only when hovered/dragged or in detail mode)
            const wallHandlePos = worldToScreen(0, state.roadWidth);
            drawMinimalHandle(
                wallHandlePos.x,
                wallHandlePos.y,
                isHoverWall || state.uiMode === 'detail' ? `${state.roadWidth.toFixed(1)}m` : '',
                isHoverWall
            );

            // Minimalist Grip Handles on Left/Right of Spot
            if (state.parkingType === 'perpendicular') {
                const leftSpotHandle = worldToScreen(-halfSpot, -bayDepth * 0.35);
                const rightSpotHandle = worldToScreen(halfSpot, -bayDepth * 0.35);
                const isHoverSpot = state.hoveredHandle === 'spotWidth' || state.dragTarget === 'spotWidth';
                drawMinimalHandle(leftSpotHandle.x, leftSpotHandle.y, '', isHoverSpot);
                drawMinimalHandle(
                    rightSpotHandle.x,
                    rightSpotHandle.y,
                    isHoverSpot || state.uiMode === 'detail' ? `${state.spotWidth.toFixed(2)}m` : '',
                    isHoverSpot
                );
            }

            ctx.restore();
        }

        function drawMinimalHandle(sx, sy, text, highlighted) {
            ctx.save();
            if (!text) {
                // Sleek minimal pill grip
                const w = highlighted ? 32 : 24;
                const h = 6;
                ctx.fillStyle = highlighted ? '#38bdf8' : 'rgba(148, 163, 184, 0.45)';
                ctx.beginPath();
                ctx.roundRect(sx - w / 2, sy - h / 2, w, h, 3);
                ctx.fill();
            } else {
                ctx.font = '600 10px ui-monospace, monospace';
                const tw = ctx.measureText(text).width + 14;
                const th = 19;
                ctx.fillStyle = highlighted ? '#0284c7' : 'rgba(15, 23, 42, 0.85)';
                ctx.strokeStyle = highlighted ? '#38bdf8' : 'rgba(148, 163, 184, 0.35)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(sx - tw / 2, sy - th / 2, tw, th, 9);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#f8fafc';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, sx, sy);
            }
            ctx.restore();
        }

        function drawPlannedTrajectory(isDark) {
            const veh = VEHICLES[state.vehicleKey];
            const flat = state.plan.flatPoints;
            ctx.save();

            // 1. Subtle Ghost Outlines
            if (state.showGhostCars) {
                state.plan.segments.forEach(seg => {
                    const pts = seg.points;
                    const step = Math.max(5, Math.floor(pts.length / 4));
                    for (let i = 0; i < pts.length; i += step) {
                        const pt = pts[i];
                        const corners = getCarCorners(pt, veh.width, veh.length, 0);
                        ctx.beginPath();
                        corners.forEach((c, idx) => {
                            const sc = worldToScreen(c.x, c.y);
                            if (idx === 0) ctx.moveTo(sc.x, sc.y);
                            else ctx.lineTo(sc.x, sc.y);
                        });
                        ctx.closePath();
                        ctx.strokeStyle = seg.gear < 0
                            ? 'rgba(245, 158, 11, 0.14)'
                            : 'rgba(59, 130, 246, 0.14)';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                });
            }

            // 2. Optional 4-Wheel Tracks
            if (state.showWheelTracks) {
                const trackOffsets = [
                    { lx: veh.length * 0.32, ly: veh.width * 0.42, isFront: true },
                    { lx: veh.length * 0.32, ly: -veh.width * 0.42, isFront: true },
                    { lx: -veh.length * 0.32, ly: veh.width * 0.42, isFront: false },
                    { lx: -veh.length * 0.32, ly: -veh.width * 0.42, isFront: false }
                ];
                trackOffsets.forEach(to => {
                    ctx.beginPath();
                    flat.forEach((pt, idx) => {
                        const cos = Math.cos(pt.theta);
                        const sin = Math.sin(pt.theta);
                        const wx = pt.x + cos * to.lx - sin * to.ly;
                        const wy = pt.y + sin * to.lx + cos * to.ly;
                        const sc = worldToScreen(wx, wy);
                        if (idx === 0) ctx.moveTo(sc.x, sc.y);
                        else ctx.lineTo(sc.x, sc.y);
                    });
                    ctx.strokeStyle = to.isFront ? 'rgba(56, 189, 248, 0.25)' : 'rgba(16, 185, 129, 0.3)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                });
            }

            // 3. Main Tesla-style Glowing Path Ribbon per Segment
            state.plan.segments.forEach((seg) => {
                const isReverse = seg.gear < 0;
                ctx.beginPath();
                seg.points.forEach((pt, idx) => {
                    const sc = worldToScreen(pt.x, pt.y);
                    if (idx === 0) ctx.moveTo(sc.x, sc.y);
                    else ctx.lineTo(sc.x, sc.y);
