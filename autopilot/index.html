                });
                ctx.strokeStyle = isReverse ? '#f59e0b' : '#3b82f6';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                // Clean Pivot Dot at K-Turn points
                const firstPt = seg.points[0];
                const scFirst = worldToScreen(firstPt.x, firstPt.y);
                ctx.fillStyle = isReverse ? '#f59e0b' : '#3b82f6';
                ctx.beginPath();
                ctx.arc(scFirst.x, scFirst.y, 5.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = isDark ? '#090c12' : '#ffffff';
                ctx.lineWidth = 1.8;
                ctx.stroke();
            });

            ctx.restore();
        }

        function drawObstacles() {
            ctx.save();
            state.obstacles.forEach(obs => {
                const sc = worldToScreen(obs.x, obs.y);
                const rPx = obs.radius * state.camera.pixelsPerMeter;

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.arc(sc.x + 2, sc.y + 3, rPx, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.arc(sc.x, sc.y, rPx, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(2, rPx * 0.26);
                ctx.beginPath();
                ctx.arc(sc.x, sc.y, rPx * 0.52, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        function drawTopDownVehicle(car, isEgo, isDark) {
            const sc = worldToScreen(car.x, car.y);
            const ppm = state.camera.pixelsPerMeter;
            const lenPx = car.length * ppm;
            const widPx = car.width * ppm;

            ctx.save();
            ctx.translate(sc.x, sc.y);
            ctx.rotate(-car.theta);

            // 1. 4 Wheels (Front wheels rotate accurately with car.steer)
            const tireLen = lenPx * 0.16;
            const tireWid = widPx * 0.13;
            const frontX = lenPx * 0.30;
            const rearX = -lenPx * 0.30;
            const sideY = widPx * 0.44;

            const wheels = [
                { x: frontX, y: -sideY, angle: -(car.steer || 0) },
                { x: frontX, y: sideY, angle: -(car.steer || 0) },
                { x: rearX, y: -sideY, angle: 0 },
                { x: rearX, y: sideY, angle: 0 }
            ];

            wheels.forEach(w => {
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(w.angle);
                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = isEgo ? '#38bdf8' : '#475569';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.roundRect(-tireLen / 2, -tireWid / 2, tireLen, tireWid, 3);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // 2. Car Body Drop Shadow & Shell
            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 14;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = isEgo
                ? (isDark ? '#1e293b' : '#ffffff')
                : (isDark ? '#263042' : '#94a3b8');
            ctx.strokeStyle = isEgo
                ? (state.plan.valid ? '#3b82f6' : '#f43f5e')
                : (isDark ? '#475569' : '#64748b');
            ctx.lineWidth = isEgo ? 2.2 : 1.4;

            ctx.beginPath();
            ctx.roundRect(-lenPx / 2, -widPx / 2, lenPx, widPx, 12);
            ctx.fill();
            ctx.shadowColor = 'transparent';
            ctx.stroke();

            // 3. Sleek Panoramic Glass Cabin (No cluttered text labels on roof!)
            ctx.fillStyle = isEgo
                ? (isDark ? '#0f172a' : '#1e293b')
                : (isDark ? '#171f2e' : '#475569');
            ctx.beginPath();
            ctx.roundRect(-lenPx * 0.25, -widPx * 0.37, lenPx * 0.48, widPx * 0.74, 7);
            ctx.fill();

            // Subtle Windshield & Rear Glass Lines
            ctx.strokeStyle = isEgo ? 'rgba(148, 163, 184, 0.28)' : 'rgba(148, 163, 184, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(lenPx * 0.08, -widPx * 0.35);
            ctx.lineTo(lenPx * 0.08, widPx * 0.35);
            ctx.stroke();

            // 4. Side Mirrors
            ctx.fillStyle = isEgo ? '#3b82f6' : '#64748b';
            ctx.beginPath();
            ctx.roundRect(lenPx * 0.13, -widPx * 0.55, lenPx * 0.06, widPx * 0.07, 2);
            ctx.roundRect(lenPx * 0.13, widPx * 0.48, lenPx * 0.06, widPx * 0.07, 2);
            ctx.fill();

            // 5. Headlights & Reverse / Taillights
            ctx.fillStyle = '#e0f2fe';
            ctx.beginPath();
            ctx.roundRect(lenPx / 2 - 3.5, -widPx * 0.38, 3.5, widPx * 0.16, 1.5);
            ctx.roundRect(lenPx / 2 - 3.5, widPx * 0.22, 3.5, widPx * 0.16, 1.5);
            ctx.fill();

            const isReversing = isEgo && car.gear === 'R';
            ctx.fillStyle = isReversing ? '#f59e0b' : '#ef4444';
            ctx.beginPath();
            ctx.roundRect(-lenPx / 2, -widPx * 0.40, 3.5, widPx * 0.18, 1.5);
            ctx.roundRect(-lenPx / 2, widPx * 0.22, 3.5, widPx * 0.18, 1.5);
            ctx.fill();

            // 6. Minimalist Front Rotation Handle when Ego Car is idle
            if (isEgo && !state.simPlaying) {
                const rotDistPx = lenPx / 2 + 20;
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(lenPx / 2, 0);
                ctx.lineTo(rotDistPx, 0);
                ctx.stroke();

                const isHoverRot = state.hoveredHandle === 'carRotate' || state.dragTarget === 'carRotate';
                ctx.fillStyle = isHoverRot ? '#00d2ff' : '#3b82f6';
                ctx.beginPath();
                ctx.arc(rotDistPx, 0, isHoverRot ? 7.5 : 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            ctx.restore();
        }

        function setUIMode(mode) {
            state.uiMode = mode;
            const simpleBtn = document.getElementById('uiSimpleBtn');
            const detailBtn = document.getElementById('uiDetailBtn');
            const detailPanel = document.getElementById('detailPanel');

            if (mode === 'simple') {
                simpleBtn.className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white shadow-sm transition-all';
                detailBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
                detailPanel.classList.add('hidden');
                detailPanel.classList.remove('flex');
            } else {
                detailBtn.className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white shadow-sm transition-all';
                simpleBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
                detailPanel.classList.remove('hidden');
                detailPanel.classList.add('flex');
            }
        }

        function getPointerWorldAndScreen(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            const sx = clientX - rect.left;
            const sy = clientY - rect.top;
            const world = screenToWorld(sx, sy);
            return { sx, sy, wx: world.x, wy: world.y };
        }

        function hitTestHandles(sx, sy, wx, wy) {
            const veh = VEHICLES[state.vehicleKey];
            const ego = state.currentPose;
            const ppm = state.camera.pixelsPerMeter;

            const rotWorldDist = veh.length / 2 + 20 / ppm;
            const rotWx = ego.x + Math.cos(ego.theta) * rotWorldDist;
            const rotWy = ego.y + Math.sin(ego.theta) * rotWorldDist;
            const rotSc = worldToScreen(rotWx, rotWy);
            if (Math.hypot(sx - rotSc.x, sy - rotSc.y) < 15) {
                return { type: 'carRotate' };
            }

            if (distPointToCarOBB(wx, wy, ego, veh.width, veh.length) < 0.08) {
                return { type: 'carMove' };
            }

            for (const obs of state.obstacles) {
                if (Math.hypot(wx - obs.x, wy - obs.y) < obs.radius + 0.20) {
                    return { type: 'obstacle', item: obs };
                }
            }

            if (state.leftNeighbor.enabled && distPointToCarOBB(wx, wy, state.leftNeighbor, state.leftNeighbor.width, state.leftNeighbor.length) < 0.08) {
                return { type: 'leftNeighbor' };
            }
            if (state.rightNeighbor.enabled && distPointToCarOBB(wx, wy, state.rightNeighbor, state.rightNeighbor.width, state.rightNeighbor.length) < 0.08) {
                return { type: 'rightNeighbor' };
            }

            const wallY = worldToScreen(0, state.roadWidth).y;
            if (Math.abs(sy - wallY) < 14) {
                return { type: 'roadWall' };
            }

            if (state.parkingType === 'perpendicular' && wy < 0.2 && wy > -state.spotDepth) {
                const halfSpot = state.spotWidth / 2;
                if (Math.abs(Math.abs(wx) - halfSpot) < 0.25) {
                    return { type: 'spotWidth' };
                }
            }

            return { type: 'pan' };
        }

        canvas.addEventListener('pointerdown', (evt) => {
            const { sx, sy, wx, wy } = getPointerWorldAndScreen(evt);
            const hit = hitTestHandles(sx, sy, wx, wy);

            if (hit.type !== 'pan') {
                state.simPlaying = false;
                updatePlayButtonUI();
            }

            state.dragTarget = hit.type;
            state.dragItemRef = hit.item || null;

            if (hit.type === 'carMove') {
                state.dragOffset = { x: wx - state.currentPose.x, y: wy - state.currentPose.y };
            } else if (hit.type === 'leftNeighbor') {
                state.dragOffset = { x: wx - state.leftNeighbor.x, y: wy - state.leftNeighbor.y };
            } else if (hit.type === 'rightNeighbor') {
                state.dragOffset = { x: wx - state.rightNeighbor.x, y: wy - state.rightNeighbor.y };
            } else if (hit.type === 'obstacle' && hit.item) {
                state.dragOffset = { x: wx - hit.item.x, y: wy - hit.item.y };
            } else if (hit.type === 'pan') {
                state.dragOffset = { x: sx - state.camera.offsetX, y: sy - state.camera.offsetY };
            }
        });

        window.addEventListener('pointermove', (evt) => {
            const { sx, sy, wx, wy } = getPointerWorldAndScreen(evt);

            if (!state.dragTarget) {
                const hit = hitTestHandles(sx, sy, wx, wy);
                state.hoveredHandle = hit.type;
                if (hit.type === 'roadWall') canvas.style.cursor = 'ns-resize';
                else if (hit.type === 'spotWidth') canvas.style.cursor = 'ew-resize';
                else if (hit.type === 'carRotate') canvas.style.cursor = 'crosshair';
                else if (hit.type !== 'pan') canvas.style.cursor = 'move';
                else canvas.style.cursor = 'grab';
                return;
            }

            if (state.dragTarget === 'carMove') {
                state.startPose.x = wx - state.dragOffset.x;
                state.startPose.y = wy - state.dragOffset.y;
                state.currentPose.x = state.startPose.x;
                state.currentPose.y = state.startPose.y;
                computeParkingPlan();
            } else if (state.dragTarget === 'carRotate') {
                const angle = Math.atan2(wy - state.currentPose.y, wx - state.currentPose.x);
                state.startPose.theta = angle;
                state.currentPose.theta = angle;
                computeParkingPlan();
            } else if (state.dragTarget === 'roadWall') {
                state.roadWidth = Math.max(3.4, Math.min(8.5, Number(wy.toFixed(1))));
                document.getElementById('roadWidthSlider').value = state.roadWidth;
                document.getElementById('roadWidthVal').textContent = `${state.roadWidth.toFixed(1)} m`;
                computeParkingPlan();
            } else if (state.dragTarget === 'spotWidth') {
                const newSpotWidth = Math.max(1.8, Math.min(3.5, Math.abs(wx) * 2));
                state.spotWidth = Number(newSpotWidth.toFixed(2));
                document.getElementById('spotWidthSlider').value = state.spotWidth;
                document.getElementById('spotWidthVal').textContent = `${state.spotWidth.toFixed(2)} m`;
                computeParkingPlan();
            } else if (state.dragTarget === 'leftNeighbor') {
                state.leftNeighbor.x = wx - state.dragOffset.x;
                state.leftNeighbor.y = wy - state.dragOffset.y;
                computeParkingPlan();
            } else if (state.dragTarget === 'rightNeighbor') {
                state.rightNeighbor.x = wx - state.dragOffset.x;
                state.rightNeighbor.y = wy - state.dragOffset.y;
                computeParkingPlan();
            } else if (state.dragTarget === 'obstacle' && state.dragItemRef) {
                state.dragItemRef.x = wx - state.dragOffset.x;
                state.dragItemRef.y = wy - state.dragOffset.y;
                computeParkingPlan();
            } else if (state.dragTarget === 'pan') {
                state.camera.offsetX = sx - state.dragOffset.x;
                state.camera.offsetY = sy - state.dragOffset.y;
            }
        });

        window.addEventListener('pointerup', () => {
            state.dragTarget = null;
            state.dragItemRef = null;
        });

        canvas.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            const factor = evt.deltaY < 0 ? 1.08 : 0.92;
            state.camera.pixelsPerMeter = Math.max(32, Math.min(110, state.camera.pixelsPerMeter * factor));
        }, { passive: false });

        function toggleSimulation() {
            if (!state.plan || !state.plan.valid) return;
            const flat = state.plan.flatPoints;
            if (!flat || flat.length === 0) return;

            if (state.simProgressIndex >= flat.length - 1) {
                state.simProgressIndex = 0;
            }
            state.simPlaying = !state.simPlaying;
            updatePlayButtonUI();
        }

        function updatePlayButtonUI() {
            const icon = document.getElementById('startSimIcon');
            const text = document.getElementById('startSimText');
            if (!state.plan.valid) {
                icon.className = 'fa-solid fa-ban text-[11px]';
                text.textContent = '駐車不可';
                return;
            }
            if (state.simPlaying) {
                icon.className = 'fa-solid fa-pause text-[11px]';
                text.textContent = '一時停止';
            } else {
                icon.className = 'fa-solid fa-play text-[11px]';
                text.textContent = '駐車開始';
            }
        }

        function replanAndResetCar() {
            state.simPlaying = false;
            state.simProgressIndex = 0;
            state.currentPose = { ...state.startPose, steer: 0, gear: 'P' };
            computeParkingPlan();
            updatePlayButtonUI();
            document.getElementById('pathScrubber').value = 0;
        }

        function onScrubPath(val) {
            state.simPlaying = false;
            updatePlayButtonUI();
            const flat = state.plan.flatPoints;
            if (!flat || !flat.length) return;
            const idx = Math.max(0, Math.min(flat.length - 1, parseInt(val, 10)));
            state.simProgressIndex = idx;
            state.currentPose = { ...flat[idx] };
            updateHUDTelemetry();
        }

        function setSimSpeed(spd) {
            state.simSpeed = spd;
            ['06', '10', '16'].forEach(code => {
                const btn = document.getElementById('spd' + code);
                const match = (code === '06' && spd === 0.6) || (code === '10' && spd === 1.0) || (code === '16' && spd === 1.6);
                btn.className = match
                    ? 'px-2 py-0.5 rounded-lg text-[10px] bg-blue-600 text-white font-semibold'
                    : 'px-2 py-0.5 rounded-lg text-[10px] bg-slate-200/70 dark:bg-slate-800';
            });
        }

        function selectVehicle(key) {
            state.vehicleKey = key;
            const veh = VEHICLES[key];
            document.getElementById('carSpecLabel').textContent = `${veh.width.toFixed(2)}m × ${veh.length.toFixed(2)}m`;

            Object.keys(VEHICLES).forEach(k => {
                const btn = document.getElementById('vehBtn_' + k);
                if (k === key) {
                    btn.className = 'py-2 px-1 rounded-xl border border-blue-500 bg-blue-500/15 text-blue-500 flex flex-col items-center gap-0.5 transition';
                } else {
                    btn.className = 'py-2 px-1 rounded-xl border border-transparent bg-slate-200/50 dark:bg-slate-800/60 flex flex-col items-center gap-0.5 hover:border-blue-400 transition';
                }
            });

            replanAndResetCar();
        }

        function setParkingType(type) {
            state.parkingType = type;
            const perpBtn = document.getElementById('modePerpBtn');
            const paraBtn = document.getElementById('modeParallelBtn');
            if (type === 'perpendicular') {
                perpBtn.className = 'px-2.5 py-1 rounded-lg bg-slate-900/10 dark:bg-white/10 text-slate-900 dark:text-white transition-all';
                paraBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
                state.leftNeighbor = { enabled: true, x: -2.50, y: -2.65, theta: Math.PI / 2, width: 1.76, length: 4.50 };
                state.rightNeighbor = { enabled: true, x: 2.50, y: -2.65, theta: Math.PI / 2, width: 1.76, length: 4.50 };
                state.startPose = { x: -4.2, y: 2.3, theta: 0.0 };
            } else {
                paraBtn.className = 'px-2.5 py-1 rounded-lg bg-slate-900/10 dark:bg-white/10 text-slate-900 dark:text-white transition-all';
                perpBtn.className = 'px-2.5 py-1 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all';
                state.leftNeighbor = { enabled: true, x: -5.45, y: -1.15, theta: 0.0, width: 1.76, length: 4.45 };
                state.rightNeighbor = { enabled: true, x: 5.45, y: -1.15, theta: 0.0, width: 1.76, length: 4.45 };
                state.startPose = { x: -4.2, y: 1.45, theta: 0.0 };
            }
            replanAndResetCar();
        }

        function loadPreset(presetName) {
            state.parkingType = 'perpendicular';
            setParkingType('perpendicular');
            if (presetName === 'standard') {
                state.roadWidth = 5.6;
                state.spotWidth = 2.50;
                state.startPose = { x: -4.2, y: 2.3, theta: 0.0 };
            } else if (presetName === 'narrowAisle') {
                state.roadWidth = 4.3;
                state.spotWidth = 2.50;
                state.startPose = { x: -3.8, y: 1.7, theta: 0.0 };
            } else if (presetName === 'closeStart') {
                state.roadWidth = 5.5;
                state.spotWidth = 2.50;
                state.startPose = { x: -2.6, y: 1.4, theta: 0.0 };
            } else if (presetName === 'rightBack') {
                state.roadWidth = 5.6;
                state.spotWidth = 2.50;
                state.startPose = { x: 4.2, y: 2.3, theta: Math.PI };
            }
            document.getElementById('roadWidthSlider').value = state.roadWidth;
            document.getElementById('roadWidthVal').textContent = `${state.roadWidth.toFixed(1)} m`;
            document.getElementById('spotWidthSlider').value = state.spotWidth;
            document.getElementById('spotWidthVal').textContent = `${state.spotWidth.toFixed(2)} m`;
            replanAndResetCar();
        }

        function onDimensionSliderChange() {
            state.roadWidth = parseFloat(document.getElementById('roadWidthSlider').value);
            state.spotWidth = parseFloat(document.getElementById('spotWidthSlider').value);
            document.getElementById('roadWidthVal').textContent = `${state.roadWidth.toFixed(1)} m`;
            document.getElementById('spotWidthVal').textContent = `${state.spotWidth.toFixed(2)} m`;
            replanAndResetCar();
        }

        function toggleNeighborCar(side) {
            if (side === 'left') {
                state.leftNeighbor.enabled = !state.leftNeighbor.enabled;
                const btn = document.getElementById('toggleLeftCarBtn');
                btn.textContent = state.leftNeighbor.enabled ? '左 あり' : '左 なし';
                btn.className = state.leftNeighbor.enabled
                    ? 'px-2.5 py-1 rounded-xl bg-blue-600 text-white text-[11px] font-medium transition'
                    : 'px-2.5 py-1 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-500 text-[11px] font-medium transition';
            } else {
                state.rightNeighbor.enabled = !state.rightNeighbor.enabled;
                const btn = document.getElementById('toggleRightCarBtn');
                btn.textContent = state.rightNeighbor.enabled ? '右 あり' : '右 なし';
                btn.className = state.rightNeighbor.enabled
                    ? 'px-2.5 py-1 rounded-xl bg-blue-600 text-white text-[11px] font-medium transition'
                    : 'px-2.5 py-1 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-500 text-[11px] font-medium transition';
            }
            replanAndResetCar();
        }

        function addObstacleCone() {
            const id = Date.now();
            const offset = (state.obstacles.length % 4) * 1.2 - 1.5;
            state.obstacles.push({
                id,
                x: offset,
                y: Math.min(state.roadWidth - 0.5, 4.1),
                radius: 0.26
            });
            replanAndResetCar();
        }

        function clearObstacles() {
            state.obstacles = [];
            replanAndResetCar();
        }

        function updateVisualOptions() {
            state.showGhostCars = document.getElementById('chkGhostCars').checked;
            state.showWheelTracks = document.getElementById('chkWheelTracks').checked;
        }

        function switchTab(tabName) {
            ['vehicle', 'env'].forEach(t => {
                const btn = document.getElementById('tabBtn_' + t);
                const content = document.getElementById('tabContent_' + t);
                if (t === tabName) {

                    content.classList.add('hidden');
                    content.classList.remove('flex');
                }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            const htmlEl = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (state.darkMode) {
                htmlEl.classList.add('dark');
                icon.className = 'fa-solid fa-sun text-amber-400 text-xs';
            } else {
                htmlEl.classList.remove('dark');
                icon.className = 'fa-solid fa-moon text-slate-700 text-xs';
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const baseScale = Math.min(window.innerWidth / 21, window.innerHeight / 13);
            state.camera.pixelsPerMeter = Math.max(38, Math.min(72, baseScale));
        }

        window.addEventListener('resize', resizeCanvas);

        function animateLoop() {
            if (state.simPlaying && state.plan.valid && state.plan.flatPoints.length > 0) {
                const flat = state.plan.flatPoints;
                state.simProgressIndex += 0.65 * state.simSpeed;
                if (state.simProgressIndex >= flat.length - 1) {
                    state.simProgressIndex = flat.length - 1;
                    state.simPlaying = false;
                    state.currentPose = { ...flat[flat.length - 1], gear: 'P', steer: 0 };
                    updatePlayButtonUI();
                } else {
                    const idx = Math.floor(state.simProgressIndex);
                    const frac = state.simProgressIndex - idx;
                    const p0 = flat[idx];
                    const p1 = flat[Math.min(flat.length - 1, idx + 1)];
                    state.currentPose = {
                        x: p0.x + (p1.x - p0.x) * frac,
                        y: p0.y + (p1.y - p0.y) * frac,
                        theta: p0.theta + normalizeAngle(p1.theta - p0.theta) * frac,
                        steer: p0.steer + (p1.steer - p0.steer) * frac,
                        gear: p0.gear
                    };
                }
                document.getElementById('pathScrubber').value = Math.floor(state.simProgressIndex);
                updateHUDTelemetry();
            }

            renderScene();
            requestAnimationFrame(animateLoop);
        }

        window.onload = function () {
            resizeCanvas();
            computeParkingPlan();
            animateLoop();
        };
    </script>
</body>
</html>
